name: CoreML macOS (Tier-B runtime + ANE)

# Fills the macOS-pending numbers from COREML_RESULTS.md that the Linux routine
# cannot produce: real Core ML runtime parity (Tier-B) and the ANE compute plan.
# GitHub's macos-latest runners are Apple Silicon, so coremltools' Core ML
# runtime (libcoremlpython) and an ANE are both available here.

on:
  push:
    branches: [claude/coreml-export]
    paths:
      - "legacy_research/**"
      - ".github/workflows/coreml-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier-b:
    runs-on: macos-latest
    env:
      # The ONNX string-normalizer needs a UTF-8 locale; macOS ships en_US.UTF-8.
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn joblib onnxruntime coremltools torch

      - name: Build FP16 (+FP32) CoreML packages
        run: python legacy_research/export_coreml_multilingual.py --all --fp16 --fp32

      - name: Tier-A (numeric equivalence, sanity)
        run: python legacy_research/test/test_coreml_multilingual.py --full

      - name: Tier-B (real Core ML runtime parity + 0.70 gate)
        run: python legacy_research/test/test_coreml_multilingual.py --runtime --full

      - name: ANE compute plan (op placement)
        continue-on-error: true   # S5 is best-effort / non-blocking
        run: python legacy_research/test/ane_compute_plan.py --model all

      - name: Refresh golden fixtures (for the iOS parity job)
        run: python legacy_research/test/test_coreml_multilingual.py --emit-fixtures

      - name: Upload fixtures + report as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreml-results
          path: |
            legacy_research/COREML_RESULTS.md
            legacy_research/test/coreml_golden_fixtures.json
          if-no-files-found: warn
