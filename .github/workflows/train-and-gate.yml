name: train-and-gate

# Retrain + gate whenever data/content/thresholds change. A model that trains but
# does not clear the accuracy gate BLOCKS the run — it is never shipped. The
# per-run report card is uploaded as a CI artifact (transient), never as a
# release asset (see IMPLEMENTATION-PLAN §5a). Runs release-pack.yml on merge to
# main handle publishing.
on:
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "packs/**"
      - "content/**"
      - "scripts/train*.py"
      - "config/gate_thresholds.json"
  pull_request:
    paths:
      - "data/**"
      - "packs/**"
      - "content/**"
      - "scripts/train*.py"
      - "config/gate_thresholds.json"

jobs:
  train-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn

      - name: Train the intent model
        run: python scripts/train.py

      - name: Refresh the pack with the freshly trained model
        run: |
          cp models/intent_model.onnx            packs/en/intent_model/model.onnx
          cp models/intent_labels.pkl            packs/en/intent_model/labels.pkl
          cp models/intent_classifier_weights.json packs/en/intent_model/weights.json

      - name: Accuracy gate (blocks on regression)
        run: python scripts/ci/evaluate_gate.py --out dist/report_card.json

      - name: Upload report card (CI artifact — NOT a production asset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-card
          path: dist/report_card.json
