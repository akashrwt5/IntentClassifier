device.volume.decrease:
  confirm_prompt: For en sikkerheds skyld — skru ned for lyden?
  fulfillment: Lydstyrke skruet ned.
device.volume.increase:
  confirm_prompt: For en sikkerheds skyld — skru op for lyden?
  fulfillment: Lydstyrke skruet op.
device.volume.mute:
  confirm_prompt: For en sikkerheds skyld — slå lyden fra?
  fulfillment: Lyd slået fra.
device.volume.unmute:
  confirm_prompt: For en sikkerheds skyld — slå lyden til igen?
  fulfillment: Lyd slået til.
