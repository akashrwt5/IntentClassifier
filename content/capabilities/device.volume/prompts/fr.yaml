Cmd.VolumeDecrease:
  confirm_prompt: Pour confirmer — baisser le volume ?
  fulfillment: Volume baissé.
Cmd.VolumeIncrease:
  confirm_prompt: Pour confirmer — augmenter le volume ?
  fulfillment: Volume augmenté.
Cmd.VolumeMute:
  confirm_prompt: Pour confirmer — couper le son de vos aides auditives ?
  fulfillment: Son coupé.
Cmd.VolumeUnmute:
  confirm_prompt: Pour confirmer — réactiver le son de vos aides auditives ?
  fulfillment: Son rétabli.
