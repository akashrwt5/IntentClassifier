reminders.task.complete:
  confirm_prompt: For en sikkerheds skyld — markér din påmindelse som udført?
  fulfillment: Påmindelse markeret som færdig.
reminders.task.create:
  confirm_prompt: For en sikkerheds skyld — oprette den påmindelse?
  fulfillment: Påmindelse oprettet.
  slots:
  - name: recurrence
    prompt: ''
  - name: name
    prompt: Hvad skal jeg minde dig om?
  - name: date-time
    prompt: Hvornår skal jeg minde dig om det? Du kan sige fx 'klokken 9', 'i morgen klokken 15' eller
      'om 10 minutter'.
