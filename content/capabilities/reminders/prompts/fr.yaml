reminders.complete:
  confirm_prompt: Pour confirmer — marquer votre rappel comme terminé ?
  fulfillment: Rappel marqué comme terminé.
reminders.add:
  confirm_prompt: Pour confirmer — créer ce rappel ?
  fulfillment: Rappel créé.
  slots:
  - name: recurrence
    prompt: ''
  - name: name
    prompt: Que veux-tu que je te rappelle ?
  - name: date-time
    prompt: Quand dois-je te le rappeler ? Tu peux dire par exemple « à 9h », « demain à 15h » ou « dans
      10 minutes ».
