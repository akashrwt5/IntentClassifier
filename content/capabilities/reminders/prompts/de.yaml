reminders.task.complete:
  confirm_prompt: Zur Sicherheit — Ihre Erinnerung als erledigt markieren?
  fulfillment: Erinnerung als erledigt markiert.
reminders.task.create:
  confirm_prompt: Zur Sicherheit — diese Erinnerung erstellen?
  fulfillment: Erinnerung erstellt.
  slots:
  - name: recurrence
    prompt: ''
  - name: name
    prompt: Woran soll ich dich erinnern?
  - name: date-time
    prompt: Wann soll ich dich erinnern? Du kannst zum Beispiel sagen '9 Uhr', 'morgen um 15 Uhr' oder
      'in 10 Minuten'.
