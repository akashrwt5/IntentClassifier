action: reminders.add
back_reference:
  pattern: \bremind me again\b|\bsame reminder\b|\bsame (one|thing)\b|\banother (one|reminder)\b|\brepeat
    (it|that|the reminder)\b|\bonce more\b
  source: last_fulfilled
confirm_prompt: Just to be sure — create that reminder?
fulfillment: Reminder created.
intent: reminders.add
slots:
- entity: recurrence
  name: recurrence
  prompt: ''
  required: false
- entity: remind
  name: name
  prompt: What do you want to be reminded?
  required: true
- entity: sys.date-time
  name: date-time
  prompt: When should I remind you? You can say things like '9am', 'tomorrow at 3', or 'in 10 minutes'.
  required: true
