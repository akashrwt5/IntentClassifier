_meta:
  kind: localization-overlay
  language: de
  localizes: slot prompts, fulfillments, affirmative/negative/uncertain
  pending: keyword_triggers and back_reference regexes are language-specific grammar, authored separately
  status: draft-for-native-review
affirmative:
- 'yes'
- ok
- okay
- ja
- jawohl
- jep
- klar
- sicher
- genau
- richtig
- stimmt
- senden
- abschicken
- bestätigen
- mach das
- nur zu
- bitte
confidence_threshold: 0.7
help_marker_guard:
  markers: (wie\s+(kann|funktioniert|benutze|stelle|[aä]ndere|richte|verwende|aktiviere))|(anleitung)|(\berkl[aä]r)|(hilfe\s+(zu|beim|für))|(was\s+(ist|sind|macht|bedeutet)\b)|(wozu)|(zeig.*anleitung)
negative:
- 'no'
- cancel
- nein
- nö
- ne
- nee
- abbrechen
- stopp
- stop
- halt
- nicht
- lass es
- vergiss es
- nein danke
- lieber nicht
polarity_guards:
- blocked_intent: device.volume.unmute
  pattern: stumm(schalten)?\b|\bton aus\b
  redirect_intent: device.volume.mute
- blocked_intent: device.volume.mute
  pattern: stummschaltung (aufheben|beenden)|\bton (wieder )?an\b
  redirect_intent: device.volume.unmute
- blocked_intent: device.volume.increase
  pattern: \bleiser\b|\brunter\b|verringer|senken|reduzier
  redirect_intent: device.volume.decrease
- blocked_intent: device.volume.decrease
  pattern: \blauter\b|\bh[öo]her\b|erh[öo]h|\bhoch\b
  redirect_intent: device.volume.increase
- blocked_intent: streaming.session.start
  pattern: beende|stopp|aufh[öo]ren|aus\b
  redirect_intent: streaming.session.stop
- blocked_intent: streaming.session.stop
  pattern: starte|beginn|\ban\b
  redirect_intent: streaming.session.start
uncertain_confirm:
  cancel_message: In Ordnung, ich lasse es.
version: 2
