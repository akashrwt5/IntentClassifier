affirmative:
- 'yes'
- yeah
- yep
- yup
- sure
- ok
- okay
- send
- send it
- confirm
- correct
- do it
- go ahead
- please do
- affirmative
confidence_threshold: 0.7
keyword_triggers:
- intent: translation.session.start
  not_regex: \b(feature|function|explain|guide me|how (do|does|to)|what (is|are|languages|can)|where (is|do|are)|is
    there|does (it|the)|can (it|i)|help (with|me understand|understanding)|saved?|tutorial|available|supported|support|offered?|which|options?)\b
  regex: \btranslat(e|es|ing|ion)\b
- intent: transcription.session.start
  not_regex: \b(feature|function|explain|guide me|how (do|does|to)|what (is|are|languages|can)|where (is|do|are)|is
    there|does (it|the)|can (it|i)|help (with|me understand|understanding)|saved?|tutorial|available|supported|support|offered?|which|options?)\b
  regex: \btranscri(be|bing|ption)\b
- exact:
  - mute
  - silence
  intent: device.volume.mute
- intent: device.volume.mute
  not_regex: \b(what|how|tell me|ask|explain|mean)\b
  regex: \b(silence|hush|shush)\b
- exact:
  - unmute
  intent: device.volume.unmute
- exact:
  - push to talk
  - ptt
  intent: messaging.message.send
- intent: messaging.message.send
  not_regex: ^(yes|yeah|no|nope|cancel|don.t|okay|ok|sure|alright|please\s+send|send\s+it|send\s+now)\b
  regex: \bsend\b.{0,30}\bmessage\b
- intent: device.volume.increase
  regex: \b(increase|raise|turn up)\b.{0,15}\bvolume\b|\bvolume\b.{0,10}\b(up|higher|louder)\b|\bturn
    it up\b|\bturn up\b|\bvolume up\b|\bamplify\b
- intent: device.volume.increase
  regex: \b(too|so|very|really)\s+(quiet|low|soft|faint)\b
- intent: device.volume.increase
  regex: \b(sounds?|volume|audio|its?|everything|speech|voices?)\b.{0,12}\b(quiet|low|soft|faint|dull|unclear)\b
- intent: device.volume.increase
  regex: \b(miss|missing|can.?t (catch|hear))\b.{0,20}\b(words?|speech|conversations?|voices?)\b
- intent: device.volume.increase
  regex: \bsound(s)? like whispers?\b|\bwhispers?\b.{0,20}\b(voices?|sounds?|them|talking)\b
- intent: device.volume.increase
  regex: \bnothing\b.{0,20}\bcoming through\b|\b(slipping|passing)\b.{0,15}\bpast me\b
- intent: device.volume.increase
  regex: \b(asking|ask)\b.{0,20}\brepeat (themselves|himself|herself|yourself)\b
- intent: device.volume.increase
  regex: \b(sound|seems?|feels?)\b.{0,15}\b(so |too )?(far away|distant)\b|\bfar away\b.{0,20}\b(talk|speak|when)\b
- intent: device.volume.increase
  not_regex: \b(down|reduce|lower)\b
  regex: \b(crank|jack|pump)\b.{0,10}\b(it|the|sound|volume|up|higher)\b|\b(boost|amp)\b.{0,10}\b(it|the|sound|volume)\b
- intent: device.volume.decrease
  regex: \b(decrease|lower|reduce|turn down)\b.{0,15}\bvolume\b|\bvolume\b.{0,10}\b(down|lower|quieter)\b|\bturn
    it down\b|\bturn down\b|\bvolume down\b
- exact:
  - find my phone
  - where is my phone
  - locate my phone
  - find phone
  intent: find.phone.locate
- intent: reminders.task.create
  regex: \b(set|create|add|make)\b.{0,20}\breminder\b
- intent: reminders.task.create
  regex: \bnudge me\b|\bslip my mind\b|\bjot this down\b|\bnote this down\b|\bdon'?t (let me )?forget\b
- intent: reminders.task.create
  regex: \b(rappelle[\s-]?moi|r[eé]gler\s+une\s+alarme|mettre?\s+une\s+alarme|fixer?\s+une\s+alarme|cr[eé]er?\s+un\s+rappel|d[eé]finir?\s+un\s+rappel|mettre?\s+un\s+rappel|poser\s+un\s+rappel|ajouter\s+un\s+rappel|planifier\s+un\s+rappel|configurer\s+un\s+rappel)\b
- intent: device.volume.decrease
  regex: \b(too|way|so|very|really)\s+(hot|loud|bright|much)\b|\bcoming in (way )?too (hot|loud)\b|\btake
    the edge off\b
- intent: device.volume.decrease
  not_regex: \b(increase|raise|louder|up)\b
  regex: \b(dim|soften|dampen|quieten)\b.{0,15}\b(audio|sound|volume|it)\b
- intent: help.device_settings.show
  regex: \b(everything|audio|sounds?)\b.{0,15}\b(muffled|distorted|garbled|warped)\b
- intent: device.status.battery
  regex: \b(power|battery)\s+(reading|level|status|left|remaining)\b|\b(die|dying|run out|running out)\b.{0,20}\b(on
    me|battery|charge|power)\b|\bhow (much|long).{0,20}\b(battery|charge|power|life)\b
- intent: help.find_my_hearing_aids.show
  regex: \bping\b.{0,15}\b(hearing aids?|aids?|devices?)\b|\b(locate|find|where).{0,20}\b(hearing aids?|aids?|devices?)\b|\bcannot?
    (find|locate).{0,20}\b(device|aid)\b
- intent: messaging.message.send
  regex: \bget word to\b|\bping\b.{0,20}\b(my )?(daughter|son|wife|husband|brother|sister|mom|dad|mother|father|friend|family|partner)\b
- intent: streaming.session.start
  not_regex: \b(can i|how (do|does)|what|feature|help|accessor|clip[- ]?on|another person|someone)\b
  regex: \bpatch\b.{0,15}\b(sound|audio)\b.{0,10}\bthrough\b|\bstream\b.{0,15}\b(from|phone|tv|device)\b
- intent: device.memory.change
  not_regex: \b(what is|tell me about|help with|explain|how does|what does|about)\b
  regex: \b(party|outdoor|restaurant|meeting|tv|music|quiet|calm|noise)\b.{0,10}\bmode\b
- intent: device.memory.change
  regex: \b(load|restore|apply|use)\b.{0,20}\b(my )?(usual|default|normal|saved|last|previous)\b.{0,15}\b(config|configuration|setting|program|profile|memory)\b
- intent: device.memory.change
  regex: \b(swap|switch|change|flip)\b.{0,15}\b(to the |to my )?(program|memory|setting|mode|profile)\b.{0,20}\bfor\b
- intent: help.home.show
  regex: \bwhat features\b|\bfeatures (are )?available\b|\bpoint me in the right direction\b|\bhow does
    (this|it|everything) work\b
negative:
- 'no'
- nope
- nah
- cancel
- don't
- dont
- stop
- negative
- no thanks
- do not
- never mind
- nevermind
polarity_guards:
- blocked_intent: device.volume.unmute
  pattern: \bmute\b
  redirect_intent: device.volume.mute
- blocked_intent: device.volume.mute
  pattern: \bunmute\b|\bun-mute\b
  redirect_intent: device.volume.unmute
- blocked_intent: device.volume.increase
  pattern: \b(quiet(er)?|lower|softer|decrease|reduce|down)\b
  redirect_intent: device.volume.decrease
- blocked_intent: device.volume.decrease
  pattern: \b(loud(er)?|higher|increase|raise|up)\b
  redirect_intent: device.volume.increase
- blocked_intent: streaming.session.start
  pattern: \b(stop|end|quit|finish|turn off)\b
  redirect_intent: streaming.session.stop
- blocked_intent: streaming.session.stop
  pattern: \b(start|begin|turn on)\b
  redirect_intent: streaming.session.start
semantic_rescue_enabled: true
semantic_threshold: 0.4
slot_confidence_threshold: 0.6
uncertain_confirm:
  below_confidence: 0.8
  cancel_message: Okay, I won't.
  confirm_floor: 0.55
  intents:
  - device.volume.decrease
  - device.volume.increase
  - device.volume.mute
  - device.volume.unmute
  - find.phone.locate
  - messaging.message.send
  - reminders.task.complete
  - streaming.session.start
  - streaming.session.stop
  - transcription.session.start
  - translation.session.start
version: 2
