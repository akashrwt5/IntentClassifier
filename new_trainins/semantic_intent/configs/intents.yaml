policies:
- id: P1-result-request-vs-feature-question
  question: Is 'how do I turn up the volume' a command or a how-to? And why is 'how much battery is left'
    a command when it also starts with 'how'?
  decision: "The question word does NOT decide it. Ask instead: does the app have a function for this,\
    \ and is the user asking for its RESULT, or asking how the function works?\n  result request  -> Cmd.*\
    \   ('how much battery is left', 'where is my phone', 'what is my step count')\n  feature question\
    \ -> Help_* ('how do i check the battery', 'what battery size do i need')\nBoth frames can start with\
    \ how/what/where. The noun and the thing being asked for decide, not the opener."
  rationale: 'A rule keyed on the question word is 89.7% right on this corpus, but the wrong 10.3% is
    not random: it is 240 rows covering Cmd.BatteryLevel (54), all eight Cmd.Activity* intents (154) and
    Cmd.FindMyPhone (17) — i.e. every intent whose job is to report the user''s own data. Those are real
    app functions, so asking for them is a command. Executing a setting change when the user only asked
    how it works is the opposite error and is the more harmful one, which is why the boundary is written
    down rather than left to the model.'
- id: P1b-help-prefix-is-not-a-kind
  question: Does the `Help_` prefix mean the intent is a how-to intent?
  decision: 'No. Treat the prefix as a name, not a type. Three Help_* intents are majority action requests:
    Help_FindMyHearingAids (66% action), Help_Pairing (49%), Help_InsertDevice (47%). Help_HeartRate absorbs
    BOTH ''how does heart rate work'' and ''what is my heart rate'' because the app has no separate result
    intent for it.'
  rationale: Measured from en.csv. Any generated data, evaluation bucket or runtime rule that assumes
    Cmd.=action / Help_=question will be wrong on those intents. The taxonomy therefore records a measured
    `action_share` per intent instead of inferring a kind from the label string.
- id: P2-bare-negation
  question: What does 'don't make it louder' mean with no alternative given?
  decision: Default Fallback Intent (no action).
  rationale: A negated command with no stated alternative does not identify an action. Mapping it to the
    opposite intent is the exact shortcut the plan forbids in Section 8.
- id: P3-corrective-negation
  question: What about 'not quieter, louder' / 'I said turn it down, not up'?
  decision: The affirmed alternative wins (Cmd.VolumeIncrease / Cmd.VolumeDecrease respectively).
  rationale: A correction states a target action explicitly.
  superseded_at_runtime: 'P3 still defines the correct LABEL, but the gate no longer ACTS on it. Measured
    accuracy on this sentence shape is 0.48 for intent pairs the model was not explicitly taught and 0.74
    for ones it was — both far below the 0.97 precision the gate promises. The classifier''s answer is
    recorded and the user is asked to repeat. Cost measured before adopting: 0 of 1513 held-out rows,
    0 of 1508 validation rows and 0 of 1496 STT rows carry this structure, so real traffic is unaffected.'
- id: P4-symptom-reports
  question: Is 'I can barely hear' a volume increase?
  decision: Cmd.VolumeIncrease.
  rationale: Already present in the training data as such; it is the dominant user phrasing and the action
    is low-risk and trivially reversible.
- id: P4b-symptom-vs-requested-action
  question: '''It is too loud in here, can you make it quieter'' — does ''loud'' or ''quieter'' decide
    the intent?'
  decision: "Read what the person is ASKING FOR, not what they are describing.\n  symptom + an explicit\
    \ request -> the REQUEST decides.\n      'it is too loud ... make it quieter'  -> Decrease\n     \
    \ 'it is too quiet ... make it louder'  -> Increase\n  symptom with NO request -> the symptom implies\
    \ the action (this is P4).\n      'i can barely hear'                   -> Increase\nThe state clause\
    \ describes the problem; the request clause is the command. A sentence containing both is not ambiguous\
    \ and must never be treated as such."
  rationale: 'The model predicted Cmd.VolumeIncrease for ''it is too loud in here, can you make it quieter''
    — no negation, no correction, the action spelled out, and it still read the adjective instead of the
    verb. The corpus explains it: only 54 rows use symptom phrasing at all and they run 31 Increase to
    14 Decrease, so ''a complaint about sound'' had been learned as evidence for turning it up. F12 supplies
    the missing half in equal numbers so the adjective stops carrying the label.'
- id: P5-other-device-volume
  question: '''Turn the TV down'' / ''make the phone louder''?'
  decision: Near-OOD -> Default Fallback Intent, EXCEPT where the aid controls the TV streamer, which
    the data labels Help_Accessories.
  rationale: The aid must not silently reinterpret another device's volume as its own.
- id: P6-activity-query-vs-log
  question: '''How far have I walked'' vs ''start a walk'' — one intent or two?'
  decision: One intent per activity type (the shipped taxonomy merges log and query). Do not split.
  rationale: Matches the existing label set; splitting would invalidate the baseline comparison.
- id: P6b-generic-activity
  question: What is 'show me my activity goal' — there is no generic activity intent among the eight Cmd.Activity*
    labels.
  decision: FOLLOW THE DATASET. 'activity goal' (and target/daily goal) is Cmd.ActivityAerobics. 'activity
    summary / overview / stats / history' is Help_Health. The boundary is the NOUN, not the verb.
  rationale: 'All 8 ''activity goal'' rows in en.csv are labelled Cmd.ActivityAerobics and all ''activity
    summary'' rows are Help_Health. The split is not semantically obvious, so the model cannot infer it
    from 8 examples — F6 in build_targeted_training.py teaches it explicitly with matched openers so only
    the noun carries the label. Re-labelling was considered and rejected: the app''s behaviour is defined
    by the shipped label, not by what the phrase sounds like.'
- id: P6c-walking-vs-steps
  question: Is 'did I reach my walking goal' ActivityWalk or ActivityStep?
  decision: Cmd.ActivityWalk. 'walking' selects Walk; 'step/steps' selects Step; 'stand' selects Stand.
  rationale: 'Dataset convention: ''walking goal'' -> ActivityWalk (5 rows), ''step goal'' -> ActivityStep
    (19 rows). An earlier draft of the minimal-pair suite got this backwards and was measuring the suite''s
    own error as a model error.'
- id: P7-fallback-is-not-ood-eval
  question: Does the Default Fallback Intent class cover OOD?
  decision: No. It is a supervised reject class for anticipated unsupported phrasings. OOD is measured
    separately on a held-out suite that includes near-OOD.
  rationale: Section 11 of the plan.
