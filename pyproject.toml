# pyproject.toml — tooling configuration for the Intent Classifier repo.
#
# Scope: this file holds project *metadata* and *tool configuration* only.
# It intentionally does NOT declare a [build-system], so the repository is
# not pip-installable as a package. The workflow remains script-based
# (see the Makefile and docs/pipelines.md). If we later decide to ship an
# importable package, add a [build-system] table and a src/ layout.

[project]
name = "intent-classifier"
version = "0.1.0"
description = "On-device multilingual intent classifier for a hearing-aid app (Dialogflow replacement)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Intent Classifier Team" }]

# Runtime dependencies (mirrors requirements.txt — keep the two in sync).
# Upper bounds cap the next MAJOR to protect model-output reproducibility.
# Exact resolved versions live in requirements.lock (regenerate: `make lock`).
dependencies = [
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "scipy>=1.10,<2.0",
    "joblib>=1.3,<2.0",
    "onnxruntime>=1.16,<2.0",
    "skl2onnx>=1.16,<2.0",
    "numpy>=1.24,<3.0",
    "dateparser>=1.2,<2.0; python_version >= '3.8'",
]

[project.optional-dependencies]
# Developer tooling. Install with:  pip install -e '.[dev]'  is NOT available
# (no build-system); instead use:  pip install ruff black mypy pytest ...
# or:  make install-dev
dev = [
    "ruff>=0.5",
    "black>=24.3",
    "darker>=2.1",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    # Bundle spec + compiler/signing test dependencies. Previously undeclared:
    # CI installed jsonschema ad hoc in its pip line and nothing installed
    # referencing or cryptography, so tests/test_bundle_build.py and
    # tests/test_bundle_lifecycle.py errored on a clean environment.
    # jsonschema >=4.18 is required for the draft 2020-12 `referencing` API the
    # spec schemas rely on.
    "jsonschema>=4.18",
    "referencing>=0.30",
    "cryptography>=42.0",   # Ed25519 bundle signing/verification
]
# Extras only needed for the mobile-export / CoreML pipelines (macOS/CI).
export = [
    "coremltools>=7.0",
    "torch>=2.0",
]

# ---------------------------------------------------------------------------
# Ruff — fast linter + import sorter.
# Config is deliberately LENIENT so the existing (never-linted) code passes.
# Tighten the `select` list incrementally as the codebase is cleaned up.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
# Areas that are generated artifacts, vendored, or environments.
extend-exclude = [
    ".venv",
    ".venv-dfcompare",
    "checkpoints",
    "models",
    "multilingual_intent/models",
    "*.mlpackage",
]

[tool.ruff.lint]
# LEAN, high-signal baseline that the existing (never-linted) code already
# passes, so CI is green from day one. This catches syntax errors (E9) and real
# pyflakes bugs like undefined names (F). Cosmetic/style families (E4/E7 style,
# I import-sorting, UP pyupgrade, B bugbear) are intentionally NOT enforced yet;
# turn them on family-by-family as the code is cleaned up with `make format`.
select = ["E9", "F"]
ignore = [
    "F401",   # unused imports — common in the one-off scripts; clean up gradually
    "F811",   # redefinition — present in a few scripts
    "F841",   # unused local variable
    "F541",   # f-string without placeholders — harmless
]

[tool.ruff.lint.per-file-ignores]
# Test and one-off scripts may use bare asserts, unused imports for fixtures, etc.
"tests/**" = ["F401", "F811"]
"scripts/test_*.py" = ["F401", "F811"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["nlu", "multilingual"]

# ---------------------------------------------------------------------------
# Black — the source of truth for formatting.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
    \.venv
  | \.venv-dfcompare
  | checkpoints
  | models
  | .*\.mlpackage
)/
'''

# ---------------------------------------------------------------------------
# MyPy — type checking. Lenient: missing third-party stubs are ignored and
# untyped code is allowed, so this reports real errors without failing on the
# large body of currently-untyped code. Strictness is opt-in per module below.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
# Lenient global defaults — do not fail the build on untyped code yet.
disallow_untyped_defs = false
check_untyped_defs = false
exclude = '(^|/)(\.venv|\.venv-dfcompare|checkpoints|models|multilingual_intent/models|.*\.mlpackage)/'

# Opt a well-contained module into stricter checking as it gets typed.
# Example (uncomment when nlu is fully annotated):
# [[tool.mypy.overrides]]
# module = "nlu.*"
# check_untyped_defs = true

# ---------------------------------------------------------------------------
# Pytest.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end / integration tests",
    "coreml: requires the Core ML runtime (macOS only)",
]

[tool.coverage.run]
branch = true
source = ["packages/runtime/nlu_engine", "multilingual"]
omit = ["*/__pycache__/*", "*/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
