# VIK-038: an OPEN slot does not interrupt — and the user is not trapped.
#
# This script used to assert the opposite: that "actually just mute my hearing
# aids" mid-reminder abandoned the flow and muted. VIK-038 removed that
# deliberately, with measured cause. The classifier is trained on COMMANDS, so a
# slot answer is out-of-distribution input and its confidence is not a
# thresholdable quantity — answering "What do you want to be reminded?" with
# "walk the dog" scored Cmd.ActivityWalk at 1.000 and cancelled the reminder the
# user was in the middle of setting. Raising the bar does not separate them:
# "start my workout" (a legitimate reminder) outscores "start transcribing" (a
# real command).
#
# So the gate is the awaited entity's KIND. `remind` is open free-text — every
# utterance is a legal value, there is nothing to be right about — so the probe
# does not run and the turn is taken as the answer. The memory flow, a closed
# enum, still interrupts correctly.
#
# The escape hatch is what makes that safe, and turn 3 is here to keep it: an
# explicit cancel abandons the flow at any point.
lang: en
turns:
  - user: "set a reminder"
    expect: {type: PROMPT, intent: reminders.add}
  - user: "actually just mute my hearing aids"
    expect: {not_intent: Cmd.VolumeMute, not_action: volume.mute}
  - user: "cancel"
    expect: {intent: sys.slot.cancelled}
