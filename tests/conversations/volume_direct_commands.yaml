# Direct volume commands fulfil without friction.
#
# Turn 3 used to expect `type: CONFIRM` — 0.75 sat under ND-11(a)'s 0.80 confirm
# bar. That gate went in 0ad05a7e ("one fire threshold, no confidence-driven
# confirmation"), and the turn now scores 0.99 and fires, which is the intended
# behaviour under a single threshold. The "yes" that answered the confirm went
# with it; there is nothing left to answer.
lang: en
turns:
  - user: "mute"
    expect: {type: FULFILL, intent: Cmd.VolumeMute, action: volume.mute}
  - user: "unmute"
    expect: {type: FULFILL, intent: Cmd.VolumeUnmute}
  - user: "turn the volume up"
    expect: {type: FULFILL, intent: Cmd.VolumeIncrease, action: volume.increase}
