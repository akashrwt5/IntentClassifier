# Confident commands fulfil without friction; a mid-confidence volume change
# (0.75 < the 0.80 confirm bar) correctly asks first — intended ND-11(a) behavior.
lang: en
turns:
  - user: "mute"
    expect: {type: FULFILL, intent: Cmd.VolumeMute, action: volume.mute}
  - user: "unmute"
    expect: {type: FULFILL, intent: Cmd.VolumeUnmute}
  - user: "turn the volume up"
    expect: {type: CONFIRM, intent: Cmd.VolumeIncrease}
  - user: "yes"
    expect: {type: FULFILL, intent: Cmd.VolumeIncrease, action: volume.increase}
