# -----------------------------------------------------------------------------
# High-risk cross-family boundaries
# -----------------------------------------------------------------------------
# Families group siblings, but the costliest confusion is CROSS-family:
# "turn up the volume" (ExplicitCommand) vs "how do I turn up the volume?"
# (Question). Misfiring the first as the second is a False Reject; misfiring
# the second as the first is a False ACCEPT that physically changes the device.
# FAR is the priority metric, so these pairs are always eligible for hard
# negatives regardless of family.
command_help_pairs:
  Cmd.MemoryChange: Help_ChangingMemories
  Cmd.SendMessage: Help_VoiceAssistant
  Cmd.ListenMessage: Help_VoiceAssistant
  Cmd.VolumeIncrease: Help_Volume
  Cmd.VolumeDecrease: Help_Volume
  Cmd.VolumeMute: Help_Volume
  Cmd.VolumeUnmute: Help_Volume
  Cmd.EdgeModeIncrease: Help_EdgeMode
  Cmd.EdgeModeDecrease: Help_EdgeMode
  Cmd.EdgeModeDeactivate: Help_EdgeMode
  Cmd.TranscribeStart: Help_Transcribe
  Cmd.TranslationStart: Help_Translate
  Cmd.BatteryLevel: Help_Battery
  reminders.add: Help_Reminder
  reminders.complete: Help_Reminder
  Cmd.ActivityRun: Help_Activity
  Cmd.ActivityWalk: Help_Activity
  Cmd.ActivityStep: Help_Activity
  Cmd.ActivityCycle: Help_Activity
  Cmd.ActivityStand: Help_Activity
  Cmd.ActivityAerobics: Help_Activity
  Cmd.ActivityExercise: Help_Activity
  Cmd.ActivityCalories: Help_Activity
