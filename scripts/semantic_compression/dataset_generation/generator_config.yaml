# =============================================================================
# NLU Super Dataset Generator -- Central Configuration
# =============================================================================
# Single source of truth for every tunable parameter in the generation
# pipeline. Nothing in the Python scripts should hardcode a value that appears
# here (Roadmap Phase 1).
#
# All relative paths are resolved against the directory containing THIS file.
# =============================================================================

version: 1

paths:
  seed_dir: "../dialogflow-en-dataset"
  output_dir: "."
  intent_specs: "intent_specs.yaml"
  hand_authored_specs: "authored_specs.yaml"
  specs_summary: "specs_summary.md"
  seed_audit_report: "seed_audit_report.md"

  # The DEPLOYED label space. The seed folder and the shipping model have
  # drifted apart, so the audit cross-checks the taxonomy it derives against
  # this file. Without it, a dataset can be generated for a label set the app
  # cannot dispatch -- and nothing fails until integration.
  runtime_labels: "../../../packages/runtime/nlu_engine/legacy_label_map.json"
  checkpoint_dir: ".checkpoints"

  # Local API keys, read when the matching environment variable is not set.
  # Keyed by environment-variable name, e.g.
  #
  #     AZURE_OPENAI_API_KEY: "..."
  #
  # The default deliberately points OUTSIDE this repository. This repo is
  # PUBLIC, and a file that never enters the working tree cannot be committed by
  # a stray `git add -f`, cannot ride along in a stash, and cannot turn up in
  # someone else's clone. The .gitignore entries for secrets are a second line
  # of defence, not the first.
  #
  # Create it with:
  #   mkdir -p ~/.config/intentclassifier
  #   touch ~/.config/intentclassifier/secrets.yaml
  #   chmod 600 ~/.config/intentclassifier/secrets.yaml
  #
  # The environment variable still wins when both are present, so a one-off run
  # or a CI job can override the file without editing it.
  secrets_file: "~/.config/intentclassifier/secrets.yaml"

# -----------------------------------------------------------------------------
# LLM settings
# -----------------------------------------------------------------------------
llm:
  # Published Azure OpenAI rates for this deployment, USD per 1M tokens, checked
  # 2026-08. Used only to print what a run cost; nothing depends on it being
  # exact. Update it when the rate card moves -- and say so in the commit, so a
  # cost that changes for billing reasons is never mistaken for one that changed
  # because the prompt did.
  pricing:
    input_per_1m: 1.25
    output_per_1m: 10.00
    tier: "global (data-zone is 1.375 / 11.00)"

  provider: azure               # openai | azure | anthropic | google

  # The REAL model name, always -- never an Azure deployment name. This is the
  # string `supports_temperature()` reasons about, so it has to identify the
  # actual family. On Azure the deployment name goes under `azure.deployment`
  # below; the two are frequently different, and swapping them makes the
  # temperature decision silently wrong.
  model: gpt-5.1

  # Azure OpenAI only; ignored by every other provider. Nothing here is secret --
  # the key comes from AZURE_OPENAI_API_KEY and is never stored in this file.
  azure:
    endpoint: "https://pva-playground.openai.azure.com/"
    # Azure's deployment label, which happens to match the model name here.
    # They are not required to match, which is why these stay separate keys.
    deployment: "gpt-5.1"
    api_version: "2025-04-01-preview"

  # Set to null to omit the parameter entirely.
  #
  # NOTE for GPT-5 / o-series: those models REJECT this parameter outright
  # ("Unsupported parameter: 'temperature' is not supported with this model"),
  # so `llm_client` drops it automatically for them -- passing it would 400
  # every call in the run. `gpt-5-chat-latest` is the exception and accepts it.
  #
  # That auto-drop keeps the run working, but it does not restore the control.
  # Temperature is the main lever for the output variability this project
  # exists to maximise, so on a reasoning model the avoid-list is doing that
  # job alone. Worth measuring before committing a full Stage 1 to one.
  temperature: 0.1

  # OpenAI / Azure only. Leave null to omit the parameter entirely.
  #
  # REQUIRED on gpt-5.x if temperature is to work at all. langchain-openai nulls
  # temperature for that whole family unless `reasoning_effort: none` is sent
  # explicitly, and it does so silently -- see the measured table in
  # `llm_client.py`. The startup guard now refuses to run in that state rather
  # than letting a full Stage 1 generate without its main variability lever.
  #
  # Note what `none` buys and costs: temperature comes back, and the model's
  # reasoning is switched off, so a gpt-5.x model runs as an ordinary chat
  # model. A deliberate trade -- worth measuring one batch each way before
  # committing a full run to either.
  reasoning_effort: none

  max_retries: 3
  retry_backoff_seconds: 2.0
  request_timeout_seconds: 90

reproducibility:
  # Fixes seed sampling so two runs show the LLM the same evidence.
  # It does NOT make the LLM itself deterministic -- see llm.temperature.
  random_seed: 20260812

# -----------------------------------------------------------------------------
# Seed sampling
# -----------------------------------------------------------------------------
# The legacy Dialogflow export is permutation-heavy: the first N lines of a file
# are near-identical siblings ("increase the volume" / "increase the volume in
# my aids" / "Increase volume in my hearing aids"). Slicing the head of the file
# therefore shows the LLM the LEAST informative evidence available. We instead
# greedily pick a maximally diverse subset.
seed_sampling:
  strategy: max_diversity        # max_diversity | head | random
  max_seeds_per_intent: 18
  min_tokens: 1
  max_tokens: 25

  # Farthest-point selection is attracted to outliers, and the logs do contain
  # real ASR garbage filed under command intents -- one Cmd.VolumeIncrease seed
  # is a mis-transcription carrying two unrelated personal names. (Examples are
  # not quoted here: these are production transcripts and this repo is public.)
  #
  # DEFAULT OFF, deliberately. The rare-word heuristic below was measured
  # against the corpus and its false positives are unacceptable: it withholds
  # "Can you help me find my telephone please" (Cmd.FindMyPhone) and "why am I
  # not getting any sound" (Help_Volume) -- precisely the polite/implicit
  # phrasings this project exists to capture -- because it penalises lexical
  # novelty, which is the signal we want. It also strips 89 out-of-scope lines
  # from Default Fallback Intent, where chaotic junk IS the intent.
  #
  # `seed_audit.py` still reports what this heuristic WOULD flag, as review
  # candidates for a human. Leaving one garbage line in an 18-phrase sample is
  # cheaper than silently deleting good semantic evidence, and the system prompt
  # already forbids inventing capabilities from a single odd utterance.
  noise_guard:
    enabled: false
    max_hapax_tokens: 2
    min_utterances_to_apply: 30

# -----------------------------------------------------------------------------
# Generation budgets (consumed by Phase 2/3 generator.py)
# -----------------------------------------------------------------------------
generation:
  # STARTING budgets, to be corrected by measurement -- `stage1_report.py`
  # section 1b reports whether each intent saturated or was cut short, and
  # these should be revised from that rather than argued about.
  #
  # The first draft of this block was round numbers, and comparing it against
  # the shipping training set showed it was wrong in a systematic direction:
  # a flat 120 cut Default Fallback Intent from 1,308 rows to 400 and
  # Cmd.MemoryChange from 1,884 to 120, while inflating small intents.
  #
  # Flattening is partly RIGHT -- the legacy counts are permutation-heavy, so
  # 1,884 syntactic MemoryChange rows are worth far fewer semantic ones, and a
  # 36x class imbalance is its own problem. But two cases are not about
  # permutations at all, and those get scaled by what they must actually cover:
  #
  #   Default Fallback Intent -- an UNBOUNDED space (weather, smart home,
  #   ambient conversation, pure observations) and the class that decides
  #   False-Accept Rate, the project's priority metric. It needs the most
  #   coverage, not a cut.
  #
  #   Slot-bearing intents -- Cmd.MemoryChange has 38 memory values in its
  #   vocabulary. At 120 utterances that is ~3 per value, which cannot cover
  #   the slot space the product actually uses. reminders.add carries
  #   recurrence and reminder-type slots similarly.
  # A stratified sample for testing CONFIG changes without paying for a corpus.
  #
  # A full run is 348 calls; a config question does not need 8,360 rows to answer,
  # it needs a sample that spans the space the config varies over. Twelve intents
  # at one batch each is 12 calls -- roughly 3% of a full run -- and covers both
  # length-target extremes, both quota profiles, the worst boundary risks, the
  # highest-volume Command-vs-Question pair, and the two blind spots where the
  # target had to be inferred because no deployed rows exist.
  #
  # Run it with: python generator.py --pilot
  #
  # Every entry earns its place; do not add intents because they seem interesting.
  pilot:
    - Cmd.ActivityStand          # command, lowest target (18%)
    - Cmd.TranscribeStart        # command, highest target (62%) -- worst slot pressure
    - Cmd.BatteryLevel           # command that is question-shaped: a data query
    - Help_Tinnitus              # help, lowest target (26%)
    - Help_Translate             # help, highest target (85%, at the ceiling)
    - Help_FindMyHearingAids     # worst deployed boundary rate (41%)
    - Help_Pairing               # second worst (29%) and the worst length gap so far
    - Default Fallback Intent    # open profile, largest budget, decides FAR
    - Cmd.EdgeModeIncrease       # blind spot: target inferred, no deployed rows
    - Help_Activity              # blind spot: same
    - Cmd.MemoryChange           # highest-volume Command-vs-Question pair
    - Help_ChangingMemories      # the Help side of that same pair

  utterances_per_intent:
    default: 120
    overrides:
      # Unbounded scope + FAR-critical.
      Default Fallback Intent: 800

      # Slot-bearing: budget scales with the vocabulary each must cover.
      Cmd.MemoryChange: 300
      reminders.add: 200

      # Physically change the device, and carry the richest semantic space.
      Cmd.VolumeIncrease: 180
      Cmd.VolumeDecrease: 180
      Cmd.EdgeModeIncrease: 180
      Cmd.EdgeModeDecrease: 160
  hard_negatives_per_intent: 40
  oos_ratio: 0.15
  max_utterance_words: 20

  # ---------------------------------------------------------------------------
  # Seed privacy at GENERATION time
  # ---------------------------------------------------------------------------
  # `taxonomy.hand_authored_intents` keeps an intent's SPECIFICATION off a
  # third-party API. It does nothing about the generation call, which is a
  # separate request that carries real seed utterances of its own. Every intent
  # gets a seed block, and `generator.py` does not ask whether the spec was
  # hand-written.
  #
  # For `Default Fallback Intent` those seeds are 613 raw production ASR
  # transcripts of hearing-aid users, including speech captured around them. The
  # sampler makes it worse than it sounds: farthest-point selection actively
  # seeks outliers, and the sensitive lines ARE the outliers.
  #
  # Measured on the current selection, the 8 seeds this intent would send match
  # none of the address / phone / health / benefits probes -- but that is the
  # output of a seeded RNG, not a guarantee. Change the random seed, the
  # sampling config or the file, and the selection changes with nothing to stop
  # it. The block is therefore withheld outright.
  privacy:
    no_seed_block_intents:
      - "Default Fallback Intent"

    # What takes the withheld block's place. Seeds carry STYLE, not categories:
    # the specification already lists what belongs in Fallback (7 trigger
    # conditions, 6 boundary cases), but only the seeds showed how it sounds.
    # Dropping them without a substitute would produce a tidy, textbook Fallback
    # set -- and tidy questions are not what causes false accepts, so FAR would
    # be understated by construction.
    #
    # Written by hand from a reading of the corpus. Nothing below is a
    # production transcript or a paraphrase of one.
    seed_block_replacement:
      "Default Fallback Intent": |
        # How this intent actually sounds
        These utterances reach a recogniser worn on the body, so much of what it
        hears was never addressed to the assistant at all. Write for that
        reality, not for clean out-of-scope queries:
        - Fragments starting mid-thought, with the opening words missing.
        - Speech aimed at another person nearby and captured incidentally.
        - Mis-transcriptions where every word is real English but the sentence
          means nothing.
        - Trailing off, self-interruption, repetition, filled pauses.
        - Background media: a television, a radio, someone else's conversation.
        - One- or two-word bursts with no context around them.
        - Speech that NAMES a listening environment (restaurant, church,
          outdoors, car, meeting, music) purely descriptively or to another
          person, with NO request to switch anything -- describing the place,
          the weather there, who was there, how it felt. The product treats an
          environment named AS a request as a memory switch, so these
          no-request mentions are the costliest false accepts -- include a
          generous share of them, and vary the sentence shapes rather than
          repeating one "this place is nice" template. Keep them in the past
          tense, about a place already left, or clearly aimed at another
          person. Do NOT write first-person present-tense arrival statements
          ("I'm in the restaurant now") -- the product treats those as a
          memory-switch request, so they belong to Cmd.MemoryChange, not here.
        - Fully formed but out-of-scope requests: weather, news, shopping,
          navigation, smart-home devices, another assistant, the television.
        - Greetings, thanks and small talk aimed at the assistant.
        SCOPE GUARD -- read before writing any request-shaped utterance. This
        product ITSELF supports: hearing-aid volume and mute control, Edge
        Mode, switching listening memories, audio streaming, transcription,
        translation, reminders, voice messages to named people, battery
        status, find-my-phone, and activity/health queries. NEVER generate a
        request for any of those capabilities, however phrased -- "remind me
        to...", "send a message to...", "text her that..." are real commands
        this assistant must act on, and putting them here teaches it to
        ignore its own users. Out-of-scope means OTHER products and other
        life domains, not this product's own features.
        Aim for roughly half well-formed out-of-scope requests and half of the
        messy incidental kind.

  validation:
    # Architecture Section 6, precedence rule 3, is about INTENT ASSIGNMENT: an
    # utterance that cancels an action without offering a replacement belongs to
    # the Fallback intent. It is not a rule about the `type` field of a positive
    # that is otherwise valid for its intent.
    #
    # For the intents below, cancellation IS the product capability. "Stop
    # streaming" is an affirmative ExplicitCommand for Cmd.StreamingStop -- it
    # negates nothing, it invokes a feature. Measured against the export, the
    # opener check would reject 40% of Cmd.StreamingStop's own shipping seeds
    # and 31% of Cmd.EdgeModeDeactivate's, i.e. the intent's most natural
    # phrasings, which is how an intent ends a run with zero usable rows.
    #
    # Cmd.VolumeMute is listed pre-emptively: its seeds do not currently trip
    # the check, but muting is the same kind of capability and generated
    # phrasings will reach for the same verbs.
    cancellation_capability_intents:
      - Cmd.StreamingStop
      - Cmd.EdgeModeDeactivate
      - Cmd.VolumeMute

  # Utterances requested per call. Deliberately small: asking for an intent's
  # whole budget in one request produces visibly degrading output, because the
  # model spends its genuinely distinct phrasings early and pads the tail with
  # the word-substitution variants Section 1 exists to eliminate.
  batch_size: 25

  # How many already-accepted utterances are shown back to the model as "do not
  # repeat". This is what keeps batch N+1 from re-deriving batch N.
  #
  # Raised from 60 to 120 on evidence. A full 180-utterance run of
  # Cmd.VolumeIncrease produced exactly four near-duplicate pairs, and the two
  # members of every one of them sat 72, 75, 77 and 96 rows apart -- every
  # single pair further apart than the window, and not one collision inside it.
  # The window was therefore the whole cause: once a line falls out of it the
  # model can no longer see what it must not repeat.
  #
  # 120 costs roughly 750 extra input tokens per call (~0.26M across a full
  # Stage 1), which is negligible against the run's ~1.4M. It is not a complete
  # answer either -- Default Fallback Intent alone is budgeted at 800, so most
  # of its accepted rows stay invisible whatever this is set to. Catching what
  # slips past remains Stage 2's job; this is cheap insurance in front of it.
  avoid_list_max: 120

  # Consecutive UNUSABLE batches before an intent is abandoned. Section 7 asks
  # for the failed sample to be regenerated rather than the batch, so a batch
  # that yields any usable rows resets this counter. It only trips when a batch
  # produces nothing at all, several times running -- the intent is genuinely
  # stuck rather than merely imperfect.
  max_consecutive_failed_batches: 3

  # Real seed utterances shown per request as a STYLE reference. Kept small on
  # purpose -- the more seeds shown, the more the output regresses toward
  # rewording them, which is the failure mode this project was started to fix.
  seed_reference_count: 8

  # Target spread. Hard cases are where FAR is won or lost, so they are
  # over-weighted relative to their natural frequency.
  #
  # Rendered into the prompt as COUNTS, not as a percentage the model is asked
  # to "aim for roughly". The first real run asked for 35/40/25 and returned
  # 21/40/39 -- a list of proportions gets read and approximated away.
  difficulty_mix:
    Easy: 0.35
    Medium: 0.40
    Hard: 0.25

  # ---------------------------------------------------------------------------
  # Composition quotas
  # ---------------------------------------------------------------------------
  # WHY THIS EXISTS. The prompt used to name six speaking styles and ask for "a
  # spread" of them. Measured over 180 real utterances for Cmd.VolumeIncrease,
  # that produced:
  #
  #     utterance length      generated      real Dialogflow seeds
  #     1-3 words                  0.0%                      30.9%
  #     4 words                    0.6%                      26.5%
  #     8-12 words                70.0%                       8.8%
  #     compound (obs+cmd)        65.0%                       0.0%
  #
  # Real users say "Louder" 57% of the time; one generated utterance in 180 was
  # that short, and not one of the 68 real seeds is a compound. A model fitted
  # on that would meet the commonest real phrasing almost out of distribution.
  # Worse, filling a COMMAND intent with observation clauses erodes the very
  # feature that separates it from Fallback, which is defined by pure
  # observation -- and that boundary is where False-Accept Rate is decided.
  #
  # Deliberately NOT set to the seed proportions. The seed corpus is
  # permutation-heavy, short commands are lexically cheap to learn, and the
  # architecture over-weights hard cases on purpose. 0.6% is not a trade-off
  # though; it is an omission. These numbers guarantee the short/direct region
  # is covered without letting it dominate.
  #
  # Fractions of the batch, rendered as counts against the actual batch size so
  # a short final batch keeps the same proportions.
  quotas:
    # Longest matching prefix wins; an exact intent name beats any prefix.
    assign:
      "Cmd.": command
      "Help": help
      "reminders.": open
      "Default Fallback Intent": open

    profiles:
      # 24 intents, 3,280 rows. The only profile with measurements behind it.
      command:
        # A floor only, and the single most load-bearing number here.
        #
        # Raised 0.20 -> 0.36 for two reasons found by measurement.
        #
        # First, it has to agree with the difficulty target. `Easy` is now
        # defined structurally as "short, single-clause, direct", so asking for
        # 36% Easy while only requiring 20% short states one quantity twice with
        # two different values. The model resolved that exactly as instructed:
        # it produced 39 short utterances, labelled 34 of them Easy, and Easy
        # landed at 21% against a 36% target. The contradiction was ours.
        #
        # Second, a minimum on one end of a fixed-size batch IS the maximum on
        # the other, and minima are the only quota the model actually honours --
        # every batch met `min_short` and every batch broke the
        # ObservationPlusCommand ceiling. Nine short utterances out of 25 leaves
        # at most sixteen that can be long, which is the only working lever we
        # have on length.
        #
        # 36% is still well inside observed usage: 57% of the real seeds are
        # four words or fewer.
        # 0.36 was measured and overshot: it delivered 67 short utterances out of
        # 180 and broke the vocabulary-novelty guard (0.730 against a 0.750
        # floor), because there are only so many distinct ways to say "louder"
        # in four words. 0.28 sits between the 0.20 that under-covered and the
        # 0.36 that over-concentrated.
        min_short: 0.28                          # <= 4 words -> at least 7 of 25

        # There is deliberately NO length quota on the long end.
        #
        # A previous version required 2-4 utterances of 13+ words and got about
        # one per batch, which read as the model refusing. It was not. The
        # length histogram of that run peaks at 10 words and falls off a cliff
        # at 13: 8-12 words holds 56% of the batch, 13+ holds 4%. The threshold
        # had simply been drawn a word or two past where natural speech stops.
        #
        # And the model needs no encouragement here: 60.6% of its output is 8+
        # words against 8.8% of the real seeds. Quota what the model
        # under-produces, not what it already over-produces. The long share is
        # controlled from the other end, by `min_short`.
        # A batch is a zero-sum budget of `batch_size` slots, and these
        # constraints overlap: a four-word utterance is nearly always an
        # ExplicitCommand, while a compound needs five words or more. Stacking a
        # short floor, an ExplicitCommand floor and a compound floor therefore
        # spends the batch before the model has any freedom left -- measured, a
        # short floor of 9 and compounds landing at 12 consumed 21 of 25 slots,
        # and ExplicitCommand outside the short rows collapsed from 44 to 4.
        #
        # The ExplicitCommand floor was briefly removed as "redundant" and then
        # put back. The reasoning behind removing it was wrong twice over.
        #
        # It looked redundant only because `min_short` was at 0.36: nine short
        # rows are explicit commands by nature, so they filled a floor of ten on
        # their own. At 0.28 the floor asks for three explicit commands beyond
        # the short ones, which is a real constraint again.
        #
        # And the crowding it was blamed for came from somewhere else. The slot
        # arithmetic for the run that broke was 9 short + 1 more explicit + 3
        # implicit + 12 compounds = 25, with nothing free -- the compounds were
        # uncapped, not the floor too tight. With the ceiling restored the same
        # sum is 7 + 3 + 3 + 7 = 20 of 25, and five slots stay free.
        #
        # Underneath both errors was a method problem: the run that produced
        # this confusion changed two things at once, so neither could be
        # attributed. One change at a time from here.
        types:
          ExplicitCommand: [0.40, null]          # at least 10 of 25
          ImplicitCommand: [0.12, null]          # at least 3 of 25
          # The ceiling is restored. An earlier note here claimed maxima were
          # ignored; that was wrong. With a ceiling of 7 the model delivered
          # 9-11; with the ceiling removed it went to 12-13 and the compound
          # share rose from 39% to 48%. A partially-honoured ceiling still moves
          # the distribution by two or three rows a batch.
          ObservationPlusCommand: [0.20, 0.28]   # 5 to 7 of 25
        asr_simulated: [0.12, 0.20]              # 3 to 5 of 25

      # 33 intents, 3,960 rows -- the LARGEST block in the dataset. Set from the
      # measured Help_Volume run of 2026-08-20 (120 rows, stage1_help_volume.md),
      # not from judgement.
      #
      # What the measurement showed. The feared failure -- command-shaped style
      # guidance pushing Help toward its paired Cmd.* phrasing -- did NOT
      # happen: 118/120 rows came back type Question, with zero "can you"
      # phrasings (the agent-based rule in the Help_Volume spec held). What DID
      # fail was length: generated mean 14.8 words with 68% of rows at 13-20
      # words and none under five, against a real Help_Volume corpus averaging
      # 8.5 words with only 4% at 13+. The model over-produces long questions
      # and repeatedly hit the 20-word cap (most rejections were 21-26-word
      # Questions). Same lesson as the command profile: quota what the model
      # under-produces, and control the long end from the short end, because
      # a minimum on one side of a fixed-size batch is the maximum on the other.
      #
      # The short threshold is 7 words here, not the command profile's 4,
      # because the raw Help_Volume seed file says 4 is the wrong yardstick for
      # questions: of its 122 unique lines, 2.5% are <=4 words -- three
      # distinct phrasings in the entire file -- while 25.4% are <=7 and the
      # mean is 9.1. A floor forced at <=4 would exhaust a three-phrasing
      # space and manufacture duplicates (the same over-concentration the
      # command profile hit when min_short was 0.36). At <=7 the floor sits
      # on a band holding a quarter of real usage, and by zero-sum batch
      # arithmetic it is the lever that pushes down the 13-20-word tail.
      # `short_max_words` is read by generator.py's composition block and by
      # stage1_report.py's compliance check; the default is 4, which keeps
      # the command profile's prompt byte-identical to every paid run so far.
      #
      # The Question floor also closes a measured loophole: the only 2 non-
      # Question rows were ObservationPlusCommand, which is exempt from the
      # 20-word cap, and both were 22+ words -- the model used the type to
      # dodge the limit.
      help:
        min_short: 0.28                # at least 7 of 25 at or under the short cap
        short_max_words: 7             # "short" for a question is <=7 words, not <=4
        types:
          Question: [0.88, null]       # at least 22 of 25
        asr_simulated: [0.08, 0.16]    # 2 to 4 of 25; measured 2.5% unprompted

      # Fallback and reminders. This profile was left empty "until it has been
      # measured rather than guessed" (see _quota_profile). It has now been
      # measured, and the result reverses the expectation: leaving the length
      # unconstrained did not preserve fragmentary speech, it removed it.
      #
      #   Default Fallback Intent   deployed  mean 6.5w, 72% <= 7w, 8% at 13+
      #                             generated mean 11.1w, 16% <= 7w, 29% at 13+
      #
      # What follows is a FLOOR, not a cap. A cap would flatten the class whose
      # realism decides FAR, which is what the original note guarded against.
      # A floor only guarantees the short end exists; nothing here limits how
      # long a Fallback utterance may be.
      #
      # min_short is deliberately absent: the per-intent targets in
      # length_targets.yaml supply it. With that file removed this profile is
      # empty again and behaviour returns to what it was.
      open:
        short_max_words: 7

  # Generation-stage LLM overrides, layered on top of the top-level `llm:`.
  #
  # This block exists because the two stages want OPPOSITE settings. Authoring
  # a specification is a precision task -- there is one right answer, so
  # temperature 0.1 is correct there. Generating utterances is the reverse:
  # variability IS the deliverable, and running this stage at 0.1 would produce
  # exactly the repetitive near-duplicate output Section 1 exists to eliminate.
  #
  # Without this override the generator would silently inherit the
  # spec-authoring temperature and quietly defeat the purpose of the project.
  llm_overrides:
    temperature: 0.9

# -----------------------------------------------------------------------------
# Deduplication (Phase 3, Stage 2)
# -----------------------------------------------------------------------------
deduplication:
  # SCOPE IS THE LOAD-BEARING SETTING HERE. Read this before changing anything.
  #
  # A hard negative is, by construction, a pair with HIGH embedding similarity
  # and DIFFERENT labels -- "turn it up" vs "how do I turn it up". That is
  # exactly what a similarity threshold deletes. Running dedup across the whole
  # pool would therefore destroy the Stage 3 output this project exists to
  # create, and it would do so silently, leaving a clean-looking dataset with
  # its decision boundaries stripped out.
  #
  # Dedup is therefore WITHIN-INTENT ONLY. Cross-intent similarity is a signal
  # to keep, not noise to remove. If two utterances under different intents are
  # near-identical, that is a taxonomy defect for `seed_audit.py` to report --
  # not something the deduplicator should quietly resolve.
  scope: within_intent            # within_intent | global (global is unsafe -- see above)

  # The judge must be INDEPENDENT of the model being trained.
  #
  # This project distils BAAI/bge-small-en-v1.5 down to an L3 student
  # (see colab_distillation_stage1.py). Deduplicating with bge-small, or with
  # the student itself, is circular: "duplicate" would come to mean "duplicate
  # according to the very model we are trying to improve", so the pairs it
  # currently confuses -- the most valuable training signal we have -- would be
  # the first ones deleted.
  #
  # A stronger, different-family model is used instead. Dedup runs once, offline,
  # over roughly ten thousand short utterances, so its cost is irrelevant; only
  # its judgement matters. (The earlier value here was all-MiniLM-L6-v2, which
  # was a generic default and matched neither this stack nor this reasoning.)
  embedding_model: "sentence-transformers/all-mpnet-base-v2"

  # PLACEHOLDER -- must be calibrated before Stage 2 is trusted.
  #
  # This number was chosen by convention, not measured. Calibrate it against the
  # ground truth we already have: `seed_audit.py` identifies 47 exact
  # within-intent duplicates that SHOULD be caught, while the intents' own
  # distinct utterances SHOULD NOT be. Pick the threshold that separates those
  # two populations, and record the separation achieved.
  near_duplicate_threshold: 0.92
  calibrated: false

  normalize_before_compare: true

# -----------------------------------------------------------------------------
# Taxonomy resolution
# -----------------------------------------------------------------------------
# The raw seed directory contains 63 .txt files but only 57 real intents.
# Every rule below is evidence-backed -- run `python seed_audit.py` to
# regenerate the report that justifies it.
taxonomy:
  fallback_intent: "Default Fallback Intent"

  # ---------------------------------------------------------------------------
  # RUNTIME DELTA -- outstanding work outside this pipeline
  # ---------------------------------------------------------------------------
  # The derived taxonomy is 60 intents; the shipping label map
  # (packages/runtime/nlu_engine/legacy_label_map.json) has 57. `seed_audit.py`
  # section 4b reports the difference on every run. The remaining gap is all
  # deliberate, but it is NOT yet reflected in the runtime:
  #
  #   ADD to the runtime label map + dispatch handlers:
  #     Cmd.EdgeModeIncrease, Cmd.EdgeModeDecrease, Cmd.EdgeModeDeactivate
  #       -- new intents; 193 seed utterances exist, 0 rows in the shipping
  #          training data, no runtime label. Genuinely new capability.
  #     Help_Activity
  #       -- production folded this into Help_Health (30 of its 59 rows are
  #          activity-goal questions). Decision: keep them separate, because
  #          configuring a goal and locating a screen are different tasks.
  #
  #   REMOVE from the runtime label map + dispatch handlers:
  #     Help_HearingCareAnywhereConnect
  #       -- disabled in Dialogflow and a 100% seed subset of
  #          Help_RemoteProgramming, but still shipped (55 rows). Decision:
  #          finish the deprecation.
  #
  # Until this lands, a model trained on the 60 is NOT drop-in compatible with
  # the current app.

  # Intents whose specification is authored directly in `authored_specs.yaml`
  # and never sent to the LLM API. They are still validated by the same rules
  # that gate generated specs, and all of them need HUMAN REVIEW before Stage 1.
  #
  # All 57 are currently listed. `Default Fallback Intent` is here for the
  # privacy reason below; the other 56 were drafted in an assistant session,
  # family by family, so that sibling boundaries are mutually consistent -- a
  # per-intent API call cannot do that, because it never sees the sibling it
  # must avoid overlapping with. Remove a name from this list to hand that
  # intent back to the LLM bootstrapper.
  #
  # Default Fallback Intent is here for a privacy reason, not a quality one. Its
  # 613 seeds are raw production ASR transcripts of real hearing-aid users,
  # including ambient speech captured around them: a street address, a phone
  # number, benefits and health details, personal names and private
  # conversation. Sending any of it to a third-party API is a needless
  # disclosure of customer data. (Not quoted here -- this repo is public.)
  #
  # Nothing is lost by hand-authoring it. Fallback's specification is generic by
  # definition -- "anything out of scope, plus pure observations" -- so it does
  # not need seed evidence to be written correctly. And the seed sampler makes
  # the exposure worse than it looks: farthest-point selection actively seeks
  # unusual outliers, and the PII-bearing lines are exactly those outliers.
  hand_authored_intents:
    - "Default Fallback Intent"
    - "Cmd.VolumeIncrease"
    - "Cmd.VolumeDecrease"
    - "Cmd.VolumeMute"
    - "Cmd.VolumeUnmute"
    - "Cmd.EdgeModeIncrease"
    - "Cmd.EdgeModeDecrease"
    - "Cmd.EdgeModeDeactivate"
    - "Cmd.StreamingStart"
    - "Cmd.StreamingStop"
    - "Cmd.TranscribeStart"
    - "Cmd.TranslationStart"
    - "Cmd.BatteryLevel"
    - "Cmd.FindMyPhone"
    - "reminders.add"
    - "reminders.complete"
    - "Help_Reminder"
    - "Cmd.ActivityWalk"
    - "Cmd.ActivityStep"
    - "Cmd.ActivityRun"
    - "Cmd.ActivityCycle"
    - "Cmd.ActivityStand"
    - "Cmd.ActivityAerobics"
    - "Cmd.ActivityExercise"
    - "Cmd.ActivityCalories"
    - "Help_Volume"
    - "Help_EdgeMode"
    - "Help_IntelliVoice"
    - "Help_MaskMode"
    - "Help_Tinnitus"
    - "Help_Activity"
    - "Help_Health"
    - "Help_HeartRate"
    - "Help_HeartRateRecovery"
    - "Help_FallAlert"
    - "Help_ThriveScore"
    - "Help_FindMyHearingAids"
    - "Help_Transcribe"
    - "Help_Translate"
    - "Help_VoiceAssistant"
    - "Help_Pairing"
    - "Help_RemoteProgramming"
    - "Help_HearShare"
    - "Help_Battery"
    - "Help_CleanCare"
    - "Help_InsertDevice"
    - "Help_SelfCheck"
    - "Help_Accessories"
    - "Help_WiCROS"
    - "Help_AppSettings"
    - "Help_DeviceSettings"
    - "Help_Customize"
    - "Help_ChangingMemories"
    - "Help_MemoryOptions"
    - "Help_DemoMode"
    - "Help_Home"
    - "Help_WhatsNew"
    - "Cmd.MemoryChange"
    - "Cmd.SendMessage"
    - "Cmd.ListenMessage"
  # Intents that live in the shipping product but have NO seed .txt file. The
  # Dialogflow export is an incomplete snapshot: `Cmd.MemoryChange` is the
  # largest intent in the product (1,884 rows) and has no seed file at all.
  # Read live from the training CSVs so no production text is duplicated.
  # Intents with no flat `.txt` in the export. Sources are restricted to the
  # Dialogflow export itself and the curated PVA phrase workbook -- never the
  # training CSVs, which contain 1,337 previously GENERATED augmented phrases.
  # Seeding a generation pass from an earlier one is circular: it inherits that
  # pass's biases and contradicts the premise that the legacy material is what
  # we are replacing.
  #
  # Cmd.SendMessage and Cmd.ListenMessage now have plain .txt seeds extracted
  # from the workbook, so they need no entry here.
  additional_seed_sources:
    - path: "../dialogflow-en-dataset/Cmd.MemoryChange_usersays_en.json"
      format: dialogflow_usersays
      intent: "Cmd.MemoryChange"
      # 630 entries, but only 58 carrier templates crossed with 41 memory
      # names. Collapsing to one representative per template is the whole point:
      # showing the spec writer 18 permutations of two templates teaches it
      # almost nothing, while 18 distinct templates show the intent's shape.
      # The slot values are supplied separately via slot_vocabularies.
      collapse_templates: true

  # Dialogflow ENTITY value lists, not intents. Their contents are bare slot
  # values ("Normal", "Restaurant", "Outdoors"), not utterances. Feeding them to
  # the spec bootstrapper invents three intents that do not exist.
  #
  # They are NOT irrelevant, though -- each is the slot vocabulary for a real
  # intent, and Phase 2 generation must cover those values or the synthetic
  # data will miss the slot space the product actually uses:
  #   _EntityMemory     -> Cmd.MemoryChange   (94% of its 1,884 rows use a value)
  #   _EntityRecurrence -> reminders.add
  #   _EntityRemind     -> reminders.add
  exclude_files:
    - "_EntityMemory"
    - "_EntityMemoryFromUsersays"
    - "_EntityRecurrence"
    - "_EntityRemind"
    # From the PVA workbook. These are confirmation-gate POLARITY data, not
    # intents -- the engine's confirm gate owns that turn, not the classifier
    # (see packages/buildtime/nlu_training/fit_confirm_gate.py). They belong in
    # datasets/confirmation_fixtures.csv, and are kept here only so the seed
    # folder holds the workbook intact.
    - "_ConfirmYes"
    - "_ConfirmNo"

  # Slot vocabularies, keyed by the intent that consumes them (Phase 2).
  slot_vocabularies:
    # _EntityMemory has 38 values; the usersays export yields 41, including
    # names the entity file omits. Both are listed so generation covers the
    # union.
    Cmd.MemoryChange: ["_EntityMemory", "_EntityMemoryFromUsersays"]
    reminders.add: ["_EntityRecurrence", "_EntityRemind"]

  # Stale/renamed exports of the same intent. Phrases are unioned into the
  # target and the source name disappears from the taxonomy.
  merge_intents:
    "Help.Activity":
      into: "Help_Activity"
      reason: >-
        Dot-variant of the same intent from an older export. 25 of its 29 unique
        phrases already appear in Help_Activity; every other Help intent in the
        taxonomy uses the underscore convention. Unioned to keep the 4 extra
        phrases.

  # Intents removed from the taxonomy entirely, with their seed files.
  drop_intents:
    "Cmd.Health":
      reason: >-
        Rollup PARENT intent, not a sibling. 155 of its 160 unique utterances
        are drawn verbatim from the Cmd.Activity* children, leaving only 5 of
        its own. Keeping it would train the classifier on an impossible
        distinction (Cmd.Health vs Cmd.ActivityRun on identical text) and
        produce exactly the contradictory labels the blueprint forbids.
        Decision: keep the specific Cmd.Activity* intents; drop the parent.
      orphaned_utterances_note: >-
        5 utterances exist only under Cmd.Health and are dropped with it:
        "have i walked an hour", "how many minutes have i been walking",
        "how much further do i need to walk", "how long have i danced",
        "how many steps have i walked". Revisit if generic activity queries
        need coverage.
    "Help_HearingCareAnywhereConnect":
      reason: >-
        Disabled in Dialogflow. All 72 of its unique utterances also appear
        under Help_RemoteProgramming (100% subset, zero distinguishing phrase).
      redistribute_seeds_to: null

