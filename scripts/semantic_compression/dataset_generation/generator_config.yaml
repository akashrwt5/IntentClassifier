# scope hard-negative sampling so Stage 3 pulls confusable siblings rather than
# random intents.
families:
  AudioControl:
    - Cmd.VolumeIncrease
    - Cmd.VolumeDecrease
    - Cmd.VolumeMute
    - Cmd.VolumeUnmute
  EdgeMode:
