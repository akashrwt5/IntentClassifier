# =============================================================================
# Authored Intent Specifications
# =============================================================================
# Specs authored directly rather than bootstrapped through the LLM API. Listed
# in `generator_config.yaml` under `taxonomy.hand_authored_intents`.
#
# PROVENANCE: `Default Fallback Intent` was authored from the blueprint for
# privacy reasons (see below). The remaining 56 were drafted in an assistant
# session from the sampled seed evidence, family by family, so that boundaries
# between siblings are mutually consistent -- something a per-intent API call
# cannot do, because it never sees the sibling it must not overlap with.
#
# All of them still require HUMAN REVIEW before Stage 1. They are the source of
# truth for every downstream label.
#
# `bootstrap_specs.py` loads these, validates them with the same rules it
# applies to generated specs, and merges them into `intent_specs.yaml`.
#
# Format matches the generated specs exactly, minus `intent_family` (injected
# from config) and `_provenance` (added on load).
# =============================================================================

intents:
  # ---------------------------------------------------------------------------
  # Default Fallback Intent
  #
  # Hand-authored for PRIVACY, not quality: its 613 seed utterances are raw
  # production ASR transcripts containing real customer PII (address, phone
  # number, benefits and health details, personal names, private conversation
  # captured ambiently around the wearer). None of it goes to a third-party API.
  #
  # This costs us nothing. Fallback is the one intent whose boundaries are
  # defined by exclusion rather than by evidence -- it is "everything the
  # assistant must not act on" -- so it is authored from the blueprint
  # (Architecture Sections 6 and 7), which is a better source than the seeds
  # would have been anyway.
  # ---------------------------------------------------------------------------
  - name: "Default Fallback Intent"
    authored_by: "human (from blueprint, for privacy)"

    business_description: >-
      Catch-all for any utterance the assistant must not act on: input that is
      out of scope for the hearing aids, and in-scope observations that describe
      a state without requesting a change. Routing here produces a clarification
      rather than a device action, so it is the safe default whenever intent is
      uncertain.

    trigger_conditions:
      - Greetings, small talk, thanks, and conversational filler directed at
        the assistant.
      - Requests about the outside world - weather, sports, news, shopping,
        general knowledge, navigation.
      - Commands aimed at a different product entirely - TV, phone, smart-home
        devices, another voice assistant, music services.
      - Pure observations about the hearing aids that request no change ("it
        sounds quiet today", "the left one feels loose") - the user is
        describing, not asking.
      - Speech captured incidentally rather than addressed to the assistant -
        fragments of conversation with another person, background dialogue,
        unintelligible ASR output.
      - Requests for a hearing-aid capability the product does not have.
      - Any utterance where the intent remains genuinely ambiguous after the
        Section 6 precedence rules have been applied.
      - Complaints about hearing difficulty that carry no loudness word, name
        no environment and ask for no action ("I can't hear", "I'm struggling
        to hear people"). Acting on these would change the device on a guess.
      - How-to questions about a feature the taxonomy has no Help intent for -
        messaging, push-to-talk, and powering the aids on or off. The feature
        works; there is simply no intent that explains it, so a clarification
        is the correct response.
      - Questions about a medical or clinical matter rather than a product
        feature - what tinnitus is, why the ears ring, whether hearing loss
        can be cured, whether a measured health value is good or normal, or
        how to improve one. The product explains its own features and what its
        measurements mean, not the user's health.
    do_not_trigger:
      - An actionable in-scope command, however indirectly phrased. "I need
        more volume" is Cmd.VolumeIncrease, not Fallback - an implicit request
        carrying a loudness word is still a request.
      - An observation that is followed by an actionable command. Per the
        compound precedence rule the command decides the label, so "it's
        quieter today, make it louder" is Cmd.VolumeIncrease.
      - A genuine how-to question about a supported feature that has a
        matching Help_* intent. Those belong to that intent, not here.
        (Messaging, push-to-talk and powering the aids on or off have no such
        intent - see the trigger conditions.)
      - An in-scope command that merely arrives garbled by ASR. Degraded
        transcription of a real command is still that command, as long as the
        intent is recoverable.
      - An observation naming a LISTENING ENVIRONMENT for which the product
        has a memory ("I'm outdoors now", "I've just walked into church"). The
        product's memories are environment-scoped, so this is an implicit
        request to switch and belongs to Cmd.MemoryChange. This is the single
        narrow exception to the observation rule below.
      - A negated command that supplies a replacement action. "Don't turn it
        up, turn it down" is Cmd.VolumeDecrease by last-explicit-command
        precedence.
      - A request to be reminded of something, whatever the reminder is about.
        The subject of a reminder never decides the intent, so "remind me to
        buy milk" is reminders.add even though shopping is out of scope on its
        own. reminders.add states this identically.
    boundary_cases:
      - Uncertainty always resolves here. Fallback is the intended destination
        for ambiguity, never a failure state - False Accepts are costlier than
        False Rejects for these users, so the tie goes to inaction.
      - Observation versus command is the decisive test. If nothing in the
        utterance asks for a change, it is Fallback regardless of how much
        in-scope vocabulary it contains. The one exception is a named
        listening environment, which is an implicit memory switch - see above.
      - The exception is narrow and turns on WHAT is being observed. Stating
        where the user is ("I'm outdoors now") is Cmd.MemoryChange. Naming an
        environment as the cause of difficulty ("it's noisy in this
        restaurant, I can't follow") is Cmd.EdgeModeIncrease. The DEVICE's own
        state ("it sounds quiet today") stays here.
      - A bare negation that cancels without replacing ("no, forget it",
        "cancel that") is Fallback.
      - An in-scope topic aimed at the wrong device stays here. "Turn the TV
        up" mentions volume but is not a hearing-aid request.
      - Where an utterance is unintelligible, prefer Fallback over guessing
        the nearest command, even when a few tokens match one.
    neighbor_intents:
      - Cmd.VolumeIncrease
      - Cmd.VolumeDecrease
      - Cmd.StreamingStart
      - Cmd.EdgeModeIncrease
      - reminders.add
      - Help_Volume

      - Cmd.MemoryChange
    positive_example: "The left one has been sounding a bit quiet today."

    hard_negative_example: "It's quieter today, make it louder."

  # ===========================================================================
  # FAMILY: AudioControl
  # ---------------------------------------------------------------------------
  # The loudness axis. Kept deliberately distinct from EdgeMode, which is the
  # clarity axis. See the EdgeMode block for the shared boundary rule.
  # ===========================================================================

  - name: "Cmd.VolumeIncrease"
    authored_by: "assistant-session, pending human review"
    business_description: >-
      Raise the amplification of the hearing aids, either on both sides or on
      one named side. The user wants sound to be LOUDER.
    trigger_conditions:
      - User asks for the hearing aids to be louder, by any phrasing.
      - User states that what they are hearing is too quiet, too soft or too
        low and wants that corrected.
      - User asks for volume to be raised on one specific side or ear.
      - User asks for the volume to be raised as far as it will go.
      - User expresses a personal need for more loudness ("I need more
        volume").
    do_not_trigger:
      - Difficulty understanding speech that is attributed to the ENVIRONMENT
        - background noise, wind, a crowded room, a distant speaker. That is
        Cmd.EdgeModeIncrease; raising volume amplifies the noise too.
      - Any request to raise the volume of a TV, phone, streamer, or other
        device that is not the hearing aids.
      - Requests to mute or silence the hearing aids, which are
        Cmd.VolumeMute.
      - Any request about the loudness of the tinnitus masker or white noise
        feature, which is Help_Tinnitus.
      - Questions asking HOW to change volume rather than asking for the
        change. Those are Help_Volume.
      - An observation that says nothing is being requested ("it sounds quiet
        today"), which is Fallback.
    boundary_cases:
      - Loudness words decide this intent. If the utterance references volume,
        loudness, quietness, softness or "turn it up", it is this intent even
        when noise is also mentioned.
      - A complaint about hearing difficulty that carries no loudness word,
        names no environment and asks for no action ("I can't hear", "I'm
        struggling to hear people") is Default Fallback Intent. A wrong guess
        changes the device. Cmd.EdgeModeIncrease, Cmd.MemoryChange and Default
        Fallback Intent state this identically.
      - Per the compound rule, an observation followed by a request resolves
        here ("it's too quiet, turn it up").
      - Side-specific requests stay here; the side is a slot, not a different
        intent.
      - >-
        Magnitude words do not change the intent or the action. "All the way
        up" is the same request as "a bit louder": the product applies a fixed
        step and accepts no target level, so no spec or utterance may imply
        that a level can be set.
    neighbor_intents:
      - Cmd.VolumeDecrease
      - Cmd.VolumeUnmute
      - Help_Volume
      - Cmd.StreamingStart
      - Default Fallback Intent
      - Help_SelfCheck
      - Cmd.VolumeMute
    positive_example: "Could you make my hearing aids a bit louder please?"
    hard_negative_example: "How do I make my hearing aids louder?"

  - name: "Cmd.VolumeDecrease"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Lower the amplification of the hearing aids, either on both sides or on
      one named side. The user wants sound to be QUIETER but still audible.
    trigger_conditions:
      - User asks for the hearing aids to be quieter or softer, by any
        phrasing.
      - User states that what they are hearing is too loud and wants that
        corrected.
      - User asks for volume to be lowered on one specific side or ear.
      - User asks for the volume to be lowered as far as it will go, short of
        silence.
    do_not_trigger:
      - Requests for complete silence or muting, which are Cmd.VolumeMute. A
        request to go as low as possible is not a request for silence.
      - Complaints that sound is harsh, tinny or over-processed rather than
        too loud, which are Cmd.EdgeModeDecrease.
      - Requests to lower the volume of a TV, phone or streamer.
      - Requests to restore sound after muting, which are Cmd.VolumeUnmute.
      - Questions asking HOW to lower volume, which are Help_Volume.
      - A bare observation that something was loud, with no request to change
        it.
    boundary_cases:
      - >-
        Magnitude words do not change the intent or the action. "All the way
        down" is the same request as "a bit quieter": the product applies a
        fixed step and accepts no target level.
      - Quieter and silent are different requests. However strongly a
        reduction is worded, only explicit silence, muting or turning the
        sound off maps to Cmd.VolumeMute.
      - Words like tinny or over-processed describe sound quality, not
        loudness, and belong to Cmd.EdgeModeDecrease.
      - Under the conflicting-command rule the last explicit command wins, so
        "turn it up, no, turn it down" resolves here.
    neighbor_intents:
      - Cmd.VolumeIncrease
      - Cmd.VolumeMute
      - Cmd.EdgeModeDecrease
      - Help_Volume
      - Default Fallback Intent
      - Cmd.VolumeUnmute
    positive_example: "That's a bit much, bring it down a little."
    hard_negative_example: "It sounds tinny."

  - name: "Cmd.VolumeMute"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Silence the hearing aids completely, on both sides or on one named side.
      The endpoint is no sound, not merely low sound.
    trigger_conditions:
      - User asks for silence, muting, or for the sound to be turned off.
      - User asks to turn off one specific hearing aid or one side's sound.
      - User asks for the volume to be switched off entirely.
    do_not_trigger:
      - Requests merely to reduce loudness, however strongly worded, which are
        Cmd.VolumeDecrease.
      - Requests to increase hearing-aid volume, which are Cmd.VolumeIncrease.
      - Requests to stop streaming audio from a TV or remote microphone, which
        are Cmd.StreamingStop - the aids keep working normally afterwards.
      - Requests to power the hearing aids off as devices. Powering off is not
        a supported voice capability, and the taxonomy has no intent that
        explains it either - both a direct request ("turn my hearing aids off
        for the night") and a how-to question ("how do I turn my aids off?")
        are Default Fallback Intent.
      - Questions asking how to mute, which are Help_Volume.
      - Requests to switch to the "Mute" MEMORY, which are Cmd.MemoryChange.
        "Mute" is both a memory name and this intent's subject; an explicit
        request to change memory or program is that intent, anything else is
        this one.
    boundary_cases:
      - Muting silences amplification; it does not power down the device or end
        a stream. Utterances about stopping a stream go to Cmd.StreamingStop.
      - The phrase "turn it off" is ambiguous between muting and ending a stream. Resolve
        by the object - "turn the sound off" is this intent, "turn the TV
        streaming off" is Cmd.StreamingStop. With no object, use Fallback.
      - Side-specific muting stays here.
    neighbor_intents:
      - Cmd.VolumeUnmute
      - Cmd.VolumeDecrease
      - Cmd.StreamingStop
      - Help_Volume
      - Default Fallback Intent
      - Cmd.EdgeModeDeactivate
      - Cmd.VolumeIncrease
      - Cmd.MemoryChange
    positive_example: "Silence my hearing aids for a moment."
    hard_negative_example: "Stop streaming from the TV."

  - name: "Cmd.VolumeUnmute"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Restore sound after the hearing aids have been muted, on both sides or on
      one named side.
    trigger_conditions:
      - User asks to unmute, unsilence, or turn the sound back on.
      - User asks to turn a specific hearing aid or side back on.
      - User asks for the volume to be switched on again.
    do_not_trigger:
      - Requests to make already-audible sound louder, which are
        Cmd.VolumeIncrease.
      - Requests to lower hearing-aid volume without muting, which are
        Cmd.VolumeDecrease.
      - Requests to begin streaming from a TV or remote microphone, which are
        Cmd.StreamingStart.
      - Questions asking how to unmute, which are Help_Volume.
    boundary_cases:
      - This intent restores a previous state; it does not set a level. A
        request that names a level or direction is Cmd.VolumeIncrease.
      - The phrase "turn it on" is ambiguous between unmuting and starting a stream.
        Resolve by the object; with no object, use Fallback.
    neighbor_intents:
      - Cmd.VolumeMute
      - Cmd.VolumeIncrease
      - Cmd.StreamingStart
      - Help_Volume
      - Default Fallback Intent
      - Cmd.VolumeDecrease
    positive_example: "Turn my hearing aids back on, please."
    hard_negative_example: "Turn on the TV streaming."

  # ===========================================================================
  # FAMILY: EdgeMode
  # ---------------------------------------------------------------------------
  # The CLARITY axis: speech-in-noise processing, not loudness. The seed data is
  # explicit that environmental complaints ("it's really windy", "noisy
  # restaurant", "I can't understand him") belong here rather than to
  # AudioControl, and both families' specs are written to that same line.
  # ===========================================================================

  - name: "Cmd.EdgeModeIncrease"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Apply or strengthen Edge Mode - the adaptive processing that improves
      speech clarity in difficult listening environments. The user is
      struggling to UNDERSTAND, not merely to hear loudly enough.
    trigger_conditions:
      - User asks to activate, add or increase Edge Mode or adaptive tuning.
      - User reports difficulty understanding speech because of the
        environment - background noise, wind, a restaurant, road noise, a
        crowd.
      - User asks to focus on a particular speaker or on the people near them.
      - User names a difficult listening environment and asks for it to be
        improved without naming a feature ("it's noisy here, can you help?").
      - User asks for voices to be made clearer.
    do_not_trigger:
      - Requests framed purely in terms of loudness - louder, quieter, volume,
        too soft. Those are Cmd.VolumeIncrease.
      - Requests to reduce or switch off Edge Mode, which are
        Cmd.EdgeModeDecrease or Cmd.EdgeModeDeactivate.
      - Questions asking what Edge Mode is or how to use it, which are
        Help_EdgeMode.
      - Requests to change equalizer or noise settings within a memory, which
        are Help_Customize.
      - Requests to switch to the "Speech" MEMORY, which are Cmd.MemoryChange.
        "Speech" is both a memory name and this intent's subject; an explicit
        request to change memory or program is that intent, anything else is
        this one.
      - Requests to switch to the "Noise" MEMORY, which are Cmd.MemoryChange.
        "Noise" is both a memory name and this intent's subject; an explicit
        request to change memory or program is that intent, anything else is
        this one.
    boundary_cases:
      - Environmental cues and clarity requests decide this intent. Wind,
        noise, a crowd, a named speaker, or an explicit request for speech to
        be clearer or for focus resolves here even when the phrasing is
        indirect. A bare complaint about not understanding is not a cue - see
        below.
      - Loudness words override. If the user says "louder" or "too quiet", it
        is Cmd.VolumeIncrease regardless of any noise mentioned.
      - >-
        A complaint about hearing difficulty that carries no loudness word,
        names no environment and asks for no action ("I can't hear", "I'm
        struggling to hear people") is Default Fallback Intent. A request for
        clarity or focus is different: it asks for an action only this intent
        performs, and stays here. Cmd.VolumeIncrease, Cmd.MemoryChange and
        Default Fallback Intent state this identically.
      - Pure observations about the environment with no implied request ("it's
        noisy in here") remain Fallback.
      - A wish to hear a person with no clarity word and no external source
        named ("I want to hear the presenter") is Default Fallback Intent. A
        request for focus or clarity is this intent; a named external source
        is Cmd.StreamingStart. Cmd.StreamingStart states this identically.
    neighbor_intents:
      - Cmd.EdgeModeDecrease
      - Cmd.EdgeModeDeactivate
      - Help_EdgeMode
      - Help_Customize
      - Cmd.MemoryChange
      - Help_ChangingMemories
      - Default Fallback Intent
      - Cmd.StreamingStart
    positive_example: "I can't follow what she's saying, it's so noisy in here."
    hard_negative_example: "How do I improve my hearing with Edge Mode?"

  - name: "Cmd.EdgeModeDecrease"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Reduce the strength of Edge Mode processing while leaving it active. The
      user finds the current processing excessive or unnatural.
    trigger_conditions:
      - User asks for less Edge Mode, or to lower, reduce or turn down adaptive
        tuning.
      - User reports that Edge Mode is too strong or that there is too much of
        it.
      - User complains that the sound has become tinny, harsh or artificial.
      - User asks to decrease the comfort or communication aspect of Edge Mode.
    do_not_trigger:
      - Requests to switch Edge Mode off entirely, which are
        Cmd.EdgeModeDeactivate.
      - Requests to make sound quieter, which are Cmd.VolumeDecrease -
        loudness and processing strength are different controls.
      - Questions asking how to adjust Edge Mode, which are Help_EdgeMode.
    boundary_cases:
      - Less is not off. Only an explicit stop, end, cancel or off maps to
        Cmd.EdgeModeDeactivate.
      - Sound-quality complaints (tinny, harsh, processed, unnatural) resolve
        here rather than to Cmd.VolumeDecrease, which is purely about loudness.
    neighbor_intents:
      - Cmd.EdgeModeIncrease
      - Cmd.EdgeModeDeactivate
      - Cmd.VolumeDecrease
      - Help_EdgeMode
      - Default Fallback Intent
    positive_example: "There's too much edge mode, ease it back a bit."
    hard_negative_example: "Turn edge mode off completely."

  - name: "Cmd.EdgeModeDeactivate"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Switch Edge Mode off entirely and return the hearing aids to their
      previous program.
    trigger_conditions:
      - User asks to turn off, stop, end, cancel or deactivate Edge Mode or
        adaptive tuning.
      - User asks to return to normal listening after Edge Mode was engaged.
    do_not_trigger:
      - Requests merely to soften Edge Mode, which are Cmd.EdgeModeDecrease.
      - Requests to mute the hearing aids, which are Cmd.VolumeMute - Edge
        Mode ending does not silence anything.
      - Requests to switch to a different saved memory or program, which are
        Help_ChangingMemories.
      - Requests to stop streaming external audio, which are
        Cmd.StreamingStop.
    boundary_cases:
      - Only an explicit termination resolves here. Any wording that implies a
        remaining amount ("less", "not so much") is Cmd.EdgeModeDecrease.
      - Under the negation rule, cancelling Edge Mode without naming a
        replacement resolves here rather than to Fallback, because the seed
        evidence establishes deactivation as a supported action.
    neighbor_intents:
      - Cmd.EdgeModeDecrease
      - Cmd.EdgeModeIncrease
      - Cmd.VolumeMute
      - Help_EdgeMode
      - Default Fallback Intent
      - Cmd.StreamingStop
    positive_example: "That's enough, cancel edge mode."
    hard_negative_example: "Give me a little less edge mode."

  # ===========================================================================
  # FAMILY: Streaming
  # ===========================================================================

  - name: "Cmd.StreamingStart"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Begin routing audio from an external source - a TV streamer or a remote
      microphone - directly into the hearing aids.
    trigger_conditions:
      - User asks to start streaming, or to stream from the TV or remote
        microphone.
      - User asks the hearing aids to listen to or pick up an external source.
      - User expresses a wish to hear a named external source through their
        aids - the TV, a streamer, or a connected remote microphone.
    do_not_trigger:
      - Requests to raise hearing-aid volume, which are Cmd.VolumeIncrease -
        streaming changes the audio SOURCE, not the level.
      - Requests to unmute the aids, which are Cmd.VolumeUnmute.
      - Questions about how to set up, pair or rename an accessory, which are
        Help_Accessories.
      - Questions about how streaming works, which are Help_Accessories.
      - Requests to pair hearing aids to a phone over Bluetooth, which are
        Help_Pairing.
      - Requests to connect or pair the remote microphone itself. Connecting
        is done by hand, not by voice - a direct request is Default Fallback
        Intent, a how-to question is Help_Accessories. Streaming FROM an
        already-connected microphone is this intent.
      - Requests to play back a received message or text, which are
        Cmd.ListenMessage. A named message or sender is that intent; a named
        external source is this one.
      - Requests to switch to the "Television" MEMORY, which are
        Cmd.MemoryChange. "Television" is both a memory name and this intent's
        subject; an explicit request to change memory or program is that
        intent, anything else is this one.
    boundary_cases:
      - Streaming changes what the aids listen to. Any request about how loud
        that is belongs to the AudioControl family instead.
      - Naming an accessory does not by itself make an utterance this intent;
        a how-to question about the same accessory is Help_Accessories.
      - Ambiguous turn-it-on requests with no named source go to Fallback.
      - A wish to hear a person with no external source named ("I want to hear
        the presenter") names neither an accessory nor a clarity feature, and
        is Default Fallback Intent. Name a source and it is this intent; ask
        for focus or clarity and it is Cmd.EdgeModeIncrease.
        Cmd.EdgeModeIncrease states this identically.
    neighbor_intents:
      - Cmd.StreamingStop
      - Cmd.VolumeUnmute
      - Help_Accessories
      - Help_Pairing
      - Cmd.ListenMessage
      - Cmd.VolumeIncrease
      - Default Fallback Intent
      - Cmd.EdgeModeIncrease
      - Cmd.MemoryChange
    positive_example: "Let me hear the TV through my aids."
    hard_negative_example: "How do I start streaming from my TV streamer?"

  - name: "Cmd.StreamingStop"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Stop routing external audio into the hearing aids and return them to
      ambient listening.
    trigger_conditions:
      - User asks to stop, end, quit or disconnect streaming.
      - User asks to stop listening to the TV or the remote microphone.
      - User asks to turn off streaming from a named accessory.
    do_not_trigger:
      - Requests to mute or silence the hearing aids, which are Cmd.VolumeMute
        - ending a stream leaves the aids hearing the room normally.
      - Requests to deactivate Edge Mode, which are Cmd.EdgeModeDeactivate.
      - Requests to lower the volume, which are Cmd.VolumeDecrease.
      - Requests to restore sound after muting, which are Cmd.VolumeUnmute.
      - Questions about unpairing or removing an accessory, which are
        Help_Accessories.
    boundary_cases:
      - Ending a stream and muting are different outcomes. Resolve by the
        object of the request; where no object is named, use Fallback.
      - Turning off the TV itself is out of scope and maps to Fallback.
    neighbor_intents:
      - Cmd.StreamingStart
      - Cmd.VolumeMute
      - Help_Accessories
      - Default Fallback Intent
      - Cmd.EdgeModeDeactivate
    positive_example: "I'm done with the TV, disconnect it."
    hard_negative_example: "Mute my hearing aids."

  # ===========================================================================
  # FAMILY: SpeechServices
  # ===========================================================================

  - name: "Cmd.TranscribeStart"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Begin live speech-to-text transcription of the current conversation.
    trigger_conditions:
      - User asks to start transcribing, transcription, or captioning.
      - User asks for the conversation or meeting to be written down.
      - User asks to start recording in the sense of capturing what is said as
        text.
    do_not_trigger:
      - Requests to STOP transcribing or recording. No stop intent exists in
        this taxonomy, so those go to Fallback.
      - Requests to translate between languages, which are
        Cmd.TranslationStart.
      - Questions about what transcribe does or where to find it, which are
        Help_Transcribe.
      - Requests to set a reminder about a meeting, which are reminders.add.
    boundary_cases:
      - The seed file for this intent contains a mislabelled stop-recording
        utterance. Start and stop are different actions; only starting resolves
        here.
      - Transcription renders speech as text in the same language; anything
        naming a target language is Cmd.TranslationStart.
    neighbor_intents:
      - Cmd.TranslationStart
      - Help_Transcribe
      - reminders.add
      - Default Fallback Intent
      - Cmd.ListenMessage
      - Cmd.SendMessage
    positive_example: "Write down this conversation for me."
    hard_negative_example: "What does transcribe do?"

  - name: "Cmd.TranslationStart"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Begin translation, either by starting the translation feature for a named
      language or by asking for a specific phrase to be translated.
    trigger_conditions:
      - User asks to start, open or begin translation, with or without naming a
        language.
      - User asks how to say a specific phrase in a named language.
      - User asks what a specific word or phrase is in a named language.
      - User asks to translate into a named language.
    do_not_trigger:
      - Requests to transcribe speech in the same language, which are
        Cmd.TranscribeStart.
      - Questions about which languages are supported or how translation works,
        which are Help_Translate.
      - Requests to translate content that is not speech, which are not
        supported and map to Fallback.
    boundary_cases:
      - A question form does not make an utterance a Question type. Asking how
        to say something in another language is a request for the assistant to
        ACT, so it resolves here.
      - Asking which languages are available is genuinely information-only and
        belongs to Help_Translate.
      - A named target language is the strongest signal for this intent.
    neighbor_intents:
      - Cmd.TranscribeStart
      - Help_Translate
      - Default Fallback Intent
    positive_example: "How do I say take me to the hotel in Spanish?"
    hard_negative_example: "What languages can the translate feature use?"

