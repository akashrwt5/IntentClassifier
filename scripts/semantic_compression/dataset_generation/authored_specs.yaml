  # ===========================================================================
  # FAMILY: HelpAudio
  # ---------------------------------------------------------------------------
  # Every intent here is the Question counterpart of an audio Command. This is
  # the FAR-critical boundary: mistaking "how do I make it louder?" for "make it
  # louder" changes a hearing aid the user never asked to change.
  # ===========================================================================

  - name: "Help_Volume"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain how to control hearing-aid volume - adjusting, muting, unmuting,
      per-side control - and help with volume problems.
    trigger_conditions:
      - User asks how to change, raise, lower, mute or unmute the volume.
      - User asks how to adjust loudness on one side only.
      - User asks where the volume control is or what it does.
      - User reports a volume problem and wants it explained, such as getting no
        sound or the volume dropping to nothing.
      - User asks for help with volume changes.
    do_not_trigger:
      - Any direct request to change the volume now. Those are
        Cmd.VolumeIncrease, Cmd.VolumeDecrease, Cmd.VolumeMute or
        Cmd.VolumeUnmute.
      - Questions about the loudness of the tinnitus masker, which are
        Help_Tinnitus.
      - Questions about accessory or TV streamer volume, which are
        Help_Accessories.
      - Questions about equalizer or sound-tuning settings, which are
        Help_Customize.
      - Reports that an aid is broken, dead or not working, which are
        Help_SelfCheck. A volume-framed symptom with no fault claim - "I'm
        getting no sound", "the volume dropped to nothing" - stays here; a
        device described as faulty or not working is a fault report.
      - Questions about powering the aids on or off. That is not volume
        control, and the taxonomy has no intent for it; both direct requests
        and how-to questions are Default Fallback Intent.
    boundary_cases:
      - >-
        This intent sits on the taxonomy's costliest boundary: its four
        Command siblings physically change the device. Apply precedence rule
        4, and where the two readings are genuinely balanced prefer this
        intent - explaining something unnecessarily is far cheaper than
        changing a device unbidden.
      - >-
        Rule 4's exception for outcomes only the assistant can produce never
        fires here. Changing, raising, lowering, muting and unmuting all have
        a manual path the user controls - this intent's own trigger conditions
        are exactly those how-to questions - so no volume question is secretly
        a request. "Can I make it louder?" is this intent: the user can change
        the volume themselves, so they are asking how. "Can YOU make it
        louder?" names the assistant as the doer and is Cmd.VolumeIncrease.
      - >-
        Measured in the deployed volume data: "how do I" 95 Help : 0 Cmd; "how
        to", "where", "what" and "can I" resolve here in every recorded case;
        "can you" 4 : 149; "please ..." 5 : 113; a bare imperative 1 : 155; "I
        want" / "I need" 0 : 20. Across the whole taxonomy "can I" labels Help
        88 times against 10 and never against a device-state command.
    neighbor_intents:
      - Cmd.VolumeIncrease
      - Cmd.VolumeDecrease
      - Cmd.VolumeMute
      - Cmd.VolumeUnmute
      - Help_Accessories
      - Default Fallback Intent
      - Help_SelfCheck
      - Help_Tinnitus
    positive_example: "How do I turn the volume down on just one aid?"
    hard_negative_example: "Turn the volume down on my left aid."

  - name: "Help_EdgeMode"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain what Edge Mode is and how to use it to improve hearing in
      difficult environments.
    trigger_conditions:
      - User asks what Edge Mode is or what it does.
      - User asks how to use, apply or adjust Edge Mode.
      - User asks how to reduce noise or wind, or enhance voices, using Edge
        Mode.
      - User asks how to save an Edge Mode setting.
    do_not_trigger:
      - Any direct request to apply, strengthen, reduce or switch off Edge Mode,
        which are the Cmd.EdgeMode* intents.
      - Complaints about the current listening environment, which are
        Cmd.EdgeModeIncrease.
      - Questions about the equalizer or manual sound tuning, which are
        Help_Customize.
    boundary_cases:
      - Naming Edge Mode is not enough; the question form is what places an
        utterance here.
      - A user describing a noisy environment is asking for action, not
        explanation, and belongs to Cmd.EdgeModeIncrease.
      - Where the reading is balanced, prefer this intent over the command.
    neighbor_intents:
      - Cmd.EdgeModeIncrease
      - Cmd.EdgeModeDecrease
      - Cmd.EdgeModeDeactivate
      - Help_Customize
      - Help_IntelliVoice
      - Help_MaskMode
      - Default Fallback Intent
    positive_example: "What does Edge Mode actually do?"
    hard_negative_example: "Use edge mode to hear the speaker better."

  - name: "Help_IntelliVoice"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the IntelliVoice feature - what it is, what it does, when to use
