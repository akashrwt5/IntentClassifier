  - name: "Help_Translate"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the Translate feature - how it works, which languages are
      supported, where to find it, and whether conversations are saved.
    trigger_conditions:
      - User asks what translate does or how the translation feature works.
      - User asks which or how many languages are supported.
