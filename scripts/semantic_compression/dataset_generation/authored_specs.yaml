      - Queries that NAME walking - how far or how long the user has walked -
        which are Cmd.ActivityWalk.
      - Queries about running or jogging (Cmd.ActivityRun), cycling or biking
        (Cmd.ActivityCycle), standing (Cmd.ActivityStand), aerobics
        (Cmd.ActivityAerobics), or exercise/workout (Cmd.ActivityExercise),
        which belong to those activity intents.
      - Calorie queries with no activity named, which are
        Cmd.ActivityCalories.
    boundary_cases:
