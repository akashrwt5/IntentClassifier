  - name: "Help_Battery"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain how to charge a rechargeable hearing aid or change a disposable
      battery, including for specific device styles.
    trigger_conditions:
      - User asks how to charge their hearing aid or its battery.
      - User asks how to change or replace a hearing aid battery.
      - User asks whether they can change or charge the battery themselves.
      - User asks about charging a specific hearing aid style such as RIC or
        ITC.
    do_not_trigger:
      - Requests for the CURRENT battery level, which are Cmd.BatteryLevel.
      - Questions about cleaning the aids, which are Help_CleanCare.
      - Questions about inserting the aids in the ear, which are
        Help_InsertDevice.
      - Reports that an aid is not working, which are Help_SelfCheck.
    boundary_cases:
      - Procedure versus status is the distinction. How or can questions resolve
        here; a request for the remaining level is Cmd.BatteryLevel.
      - Battery style names such as RIC and ITC are slots, not separate intents.
    neighbor_intents:
      - Cmd.BatteryLevel
      - Help_CleanCare
      - Help_InsertDevice
      - Help_SelfCheck
      - Default Fallback Intent
    positive_example: "How do I change the battery in my hearing aid?"
    hard_negative_example: "What is my battery level?"

  - name: "Help_CleanCare"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain how to clean and care for hearing aids, including which tools and
      substances are safe, and how to deal with earwax build-up.
    trigger_conditions:
      - User asks how to clean or wash their hearing aids.
      - User asks whether water, soap or a particular substance is safe to use.
      - User asks what tools are needed for cleaning.
      - User asks how to remove or prevent wax build-up.
      - User reports wax build-up in their aid.
    do_not_trigger:
      - Questions about charging or changing batteries, which are Help_Battery.
      - Questions about inserting or removing the aids, which are
        Help_InsertDevice.
      - Reports that an aid has stopped working, which are Help_SelfCheck,
        unless the user attributes it to wax.
    boundary_cases:
      - Wax-related complaints stay here when the user attributes the problem
        to wax; unexplained device failure is Help_SelfCheck.
      - Wax questions resolve here even when phrased as a malfunction, because
        the seed evidence treats wax as a cleaning topic.
      - Where a fault is described with no cleaning or wax context, prefer
        Help_SelfCheck.
    neighbor_intents:
      - Help_Battery
      - Help_InsertDevice
      - Default Fallback Intent
    positive_example: "How do I get rid of wax build-up in my hearing aid?"
    hard_negative_example: "Why doesn't my right hearing aid work?"

  - name: "Help_InsertDevice"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain how to physically put hearing aids into the ears and take them
      out, including how a correctly seated aid should look.
    trigger_conditions:
      - User asks how to insert, put on or take out their hearing aids.
      - User asks how far the aid or earmold should go in.
      - User asks what a correctly fitted aid should look like.
      - User asks for a video or demonstration of insertion.
      - User reports being unable to get an aid on or in.
    do_not_trigger:
      - Questions about cleaning, which are Help_CleanCare.
      - Questions about charging, which are Help_Battery.
      - Questions about the aids not working once inserted, which are
        Help_SelfCheck.
      - Questions about locating a missing aid, which are
        Help_FindMyHearingAids.
    boundary_cases:
      - Physical fitting is the topic. A complaint about comfort or seating is
        this intent; a complaint about sound or function is Help_SelfCheck.
      - Left and right are slots, not separate intents.
    neighbor_intents:
      - Help_CleanCare
      - Help_SelfCheck
      - Help_Battery
      - Default Fallback Intent
    positive_example: "Show me how to put my hearing aid in."
    hard_negative_example: "How do I clean my hearing aid?"

  - name: "Help_SelfCheck"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the self-check diagnostic and help with hearing aids that are
      faulty, not detected, or performing poorly.
    trigger_conditions:
      - User asks how to run or interpret a self-check.
      - User asks whether their aids are working properly or how to test them.
      - User reports that an aid does not work, is faint, or has a problem.
      - User reports that one aid is not being found by the app.
      - User asks what a failed self-check or an X result means.
    do_not_trigger:
      - Reports that an aid is LOST rather than faulty, which are
        Help_FindMyHearingAids.
      - Connection problems between aids and phone, which are Help_Pairing.
      - Requests to raise volume because sound seems weak, which are
        Cmd.VolumeIncrease.
      - Volume problems framed as volume - no sound, volume dropped to nothing
        - with no claim that the device is faulty. Those are Help_Volume. A
        device described as broken, dead or not working resolves here.
      - Wax-related problems, which are Help_CleanCare.
    boundary_cases:
      - Broken differs from lost and from unconnected. A device fault is this
        intent; a missing device is Help_FindMyHearingAids; a connection issue
        is Help_Pairing.
      - A complaint that sound is too quiet is a volume request, not a fault
        report, unless the user says the aid is not working.
      - Where a fault report is ambiguous against a volume command, prefer this
        intent - diagnosing is safer than amplifying.
    neighbor_intents:
      - Help_FindMyHearingAids
      - Help_Pairing
      - Cmd.VolumeIncrease
      - Help_Battery
      - Help_InsertDevice
      - Help_FallAlert
      - Default Fallback Intent
      - Help_Volume
    positive_example: "There's a problem with my left hearing aid."
    hard_negative_example: "My hearing aids are too quiet, turn them up."

  - name: "Help_Accessories"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain hearing-aid accessories - TV streamer, remote microphone and
      others - including pairing, renaming, removing them, and controlling their
      volume.
    trigger_conditions:
      - User asks how to use, set up or pair an accessory.
      - User asks which accessories they have or are paired.
      - User asks how to rename, delete or unpair an accessory.
      - User asks how to change the volume of an accessory or the TV sound.
      - User asks how to start streaming from an accessory.
      - User asks for an accessory user manual or help guide.
    do_not_trigger:
      - Any direct request to start or stop streaming now, which are
        Cmd.StreamingStart and Cmd.StreamingStop.
      - Questions about pairing the aids to a PHONE, which are Help_Pairing.
      - Requests to change HEARING AID volume, which are the Cmd.Volume*
        intents.
    boundary_cases:
      - Accessory/TV volume questions belong here; hearing-aid volume changes
        belong to the Cmd.Volume* intents.
      - The named device decides the intent between this and Help_Pairing --
        accessory here, phone or car there.
      - Question form separates this intent from the streaming commands; an
        imperative naming an accessory is still a streaming command.
      - Accessory volume is a separate control from hearing-aid volume.
    neighbor_intents:
      - Cmd.StreamingStart
      - Cmd.StreamingStop
      - Help_Pairing
      - Help_Volume
      - Default Fallback Intent
    positive_example: "How do I rename my TV streamer?"
    hard_negative_example: "Start streaming from the TV."

  - name: "Help_WiCROS"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain CROS and WiCROS systems - the transmitter and receiver pair used
      for single-sided hearing - and the balance control between them.
    trigger_conditions:
      - User asks what CROS, WiCROS or Bi-CROS is, or how they differ.
      - User asks whether they have a CROS system.
      - User asks what the transmitter or receiver is or does.
      - User asks how to find, use or adjust the balance control.
      - User asks how to change transmitter or receiver loudness.
      - User asks whether balance settings persist across programs.
    do_not_trigger:
      - Requests to change ordinary hearing-aid volume, which are the
        Cmd.Volume* intents.
      - Questions about general volume control, which are Help_Volume.
      - Questions about changing programs or memories, which are
        Help_ChangingMemories.
    boundary_cases:
      - The words CROS, transmitter, receiver or balance control are the
        deciding signals.
      - Balance is a CROS-specific control and is not the same as volume, even
        though both affect loudness.
    neighbor_intents:
      - Help_DeviceSettings
      - Default Fallback Intent
    positive_example: "How does the CROS balance feature work?"
    hard_negative_example: "How do I change the volume on my hearing aids?"

  # ===========================================================================
  # FAMILY: HelpAppSettings
  # ---------------------------------------------------------------------------
  # The densest cluster in the taxonomy. Four intents all touch "settings", so
  # the line is drawn by WHAT is being configured:
  #   Help_AppSettings     - the app itself (basic vs advanced mode, version)
  #   Help_DeviceSettings  - the hardware (firmware, serial, double tap, auto)
  #   Help_Customize       - the SOUND within a memory (equalizer, noise)
  #   Help_MemoryOptions   - creating and managing memories themselves
  #   Help_ChangingMemories - SWITCHING to an existing memory
  # ===========================================================================

  - name: "Help_AppSettings"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the app's own settings - where they are, how to change them, and
      the difference between Basic and Advanced app modes.
    trigger_conditions:
      - User asks where app settings are or how to change them.
      - User asks how to switch between Basic and Advanced mode.
      - User asks what Basic or Advanced mode is, or what each offers.
      - User asks which version of the app they are running.
      - User asks whether a mode change can be reversed.
    do_not_trigger:
      - Questions about HEARING AID hardware settings such as firmware, serial
        number or double tap, which are Help_DeviceSettings.
      - Questions about sound tuning within a memory, which are Help_Customize.
      - Questions about what is new in this version, which are Help_WhatsNew.
      - Questions about the Home screen, which are Help_Home.
    boundary_cases:
      - App version questions are Help_AppSettings; questions about newly
        introduced changes are Help_WhatsNew.
      - The object of the setting decides the intent. The app itself resolves
        here; the hearing aids resolve to Help_DeviceSettings.
      - App version identification resolves here, but asking what CHANGED in
        that version is Help_WhatsNew.
    neighbor_intents:
      - Help_DeviceSettings
      - Help_WhatsNew
      - Help_Home
      - Help_Customize
      - Default Fallback Intent
      - Help_DemoMode
    positive_example: "What's the difference between Basic and Advanced mode?"
    hard_negative_example: "What's the firmware version of my aid?"

  - name: "Help_DeviceSettings"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain hearing-aid hardware settings - firmware and serial number, double
      tap sensitivity, notification playback, automatic streaming, Comfort
      Boost, automatic telephone programs and data logging.
    trigger_conditions:
      - User asks where to find the hearing aid model, serial number or firmware
        version.
      - User asks how to adjust double tap sensitivity or other tap controls.
      - User asks how to play phone notifications through the aids.
      - User asks how to set up automatic streaming or an automatic telephone
        program.
      - User asks what Comfort Boost is or when to use it.
      - User asks how to restore default settings on the aids.
      - User asks about beeps, tones or the data log.
    do_not_trigger:
      - Questions about the app's own settings or modes, which are
        Help_AppSettings.
      - Questions about the equalizer or sound tuning, which are
        Help_Customize.
      - Questions about creating or switching memories, which are
        Help_MemoryOptions and Help_ChangingMemories.
      - Questions about pairing, which are Help_Pairing.
    boundary_cases:
      - This intent covers device-level preferences that apply across all
        memories. A setting that lives inside one memory is Help_Customize.
      - Automatic streaming setup is a device preference; a request to stream
        right now is Cmd.StreamingStart.
    neighbor_intents:
      - Help_AppSettings
      - Help_MemoryOptions
      - Help_WiCROS
      - Default Fallback Intent
      - Help_Customize
    positive_example: "The double tap is too sensitive, can I adjust it?"
    hard_negative_example: "How do I access the app settings?"

  - name: "Help_Customize"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain how to fine-tune the SOUND of the hearing aids - the equalizer,
      bass and treble, background, wind and machine noise, and speech focus.
    trigger_conditions:
      - User asks what the equalizer is, where it is, or how to use it.
      - User asks how to customize or personalize hearing aid sound settings.
      - User asks how to reduce background, wind or machine noise.
      - User asks how to increase treble, high pitch or bass.
      - User asks how to change the speech focus setting.
      - User asks how to customize one side only.
    do_not_trigger:
      - Direct requests to change loudness now, which are the Cmd.Volume*
        intents.
      - Direct requests to improve clarity now, which are Cmd.EdgeModeIncrease.
      - Questions about creating or saving a memory, which are
        Help_MemoryOptions.
      - Questions about device-level preferences, which are
        Help_DeviceSettings.
      - Questions about the Edge Mode feature itself, which are Help_EdgeMode.
    boundary_cases:
      - This intent is manual, per-memory sound shaping; Edge Mode is automatic
        adaptive processing. A question naming Edge Mode goes to Help_EdgeMode.
      - Reducing noise via the equalizer is this intent; asking the aids to cope
        with noise right now is Cmd.EdgeModeIncrease.
      - Saving the result as a memory is Help_MemoryOptions.
    neighbor_intents:
      - Help_MemoryOptions
      - Help_EdgeMode
      - Help_AppSettings
      - Cmd.MemoryChange
      - Cmd.EdgeModeIncrease
      - Default Fallback Intent
      - Help_DeviceSettings
    positive_example: "How do I use the equalizer to turn down machine noise?"
    hard_negative_example: "It's too noisy in here, help me hear him."

  - name: "Help_ChangingMemories"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain how to switch between existing hearing aid memories or programs,
      using the app or the button on the aid.
    trigger_conditions:
      - User asks how to change, switch or access memories or programs.
      - User asks how to move to a different program on the aids or in the app.
      - User asks which memory they are currently in.
      - User asks where the memory button is, or what the memory button does.
      - User asks what a memory is.
      - User asks how to return to the normal memory.
      - User asks whether they have a particular memory available.
    do_not_trigger:
      - Any actual request to switch memory now, which is Cmd.MemoryChange.
        That intent carries 1,884 utterances against this one's 91, so the
        Command reading is by far the more likely and a false accept here is
        the costlier error.
      - Questions about CREATING, saving, customizing or deleting a memory,
        which are Help_MemoryOptions.
      - Questions about tuning sound within a memory, which are Help_Customize.
      - Requests to switch to Edge Mode now, which are Cmd.EdgeModeIncrease.
    boundary_cases:
      - Switching between memories that already exist is this intent; bringing a
        new memory into existence, or changing what a memory contains, is
        Help_MemoryOptions. This is the single most likely confusion for this
        label.
      - Asking what memory is currently active resolves here even though it is a
        status question, since no command intent exists for it.
      - This is the product's highest-volume Command-versus-Question pair. An
        imperative or a named environment is Cmd.MemoryChange; only a genuine
        how, where or what question resolves here.
    neighbor_intents:
      - Cmd.MemoryChange
      - Help_MemoryOptions
      - Cmd.EdgeModeIncrease
      - Default Fallback Intent
      - Help_Tinnitus
    positive_example: "How do I switch to the Music memory?"
    hard_negative_example: "How do I create a custom memory?"

  - name: "Help_MemoryOptions"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain how to create, save, personalize, geotag, reset and delete hearing
      aid memories.
    trigger_conditions:
      - User asks how to create, add or make a custom memory.
      - User asks how to save settings into a memory.
      - User asks how to delete or reset memories.
      - User asks what geotagging is or how to tag a location to a memory.
      - User asks what memory options are available.
      - User reports that an expected memory is missing from their list.
    do_not_trigger:
      - Questions about SWITCHING to an existing memory, which are
        Help_ChangingMemories.
      - Questions about the equalizer or sound tuning controls themselves, which
        are Help_Customize.
      - Questions about Mask Mode as a feature, which are Help_MaskMode.
    boundary_cases:
      - Managing the set of memories is this intent; moving between them is
        Help_ChangingMemories.
      - A request to add a named mode as a saved memory resolves here, even when
        that mode has its own help intent.
      - Saving equalizer changes is memory management; making those changes is
        Help_Customize.
    neighbor_intents:
      - Help_ChangingMemories
      - Cmd.MemoryChange
      - Help_Customize
      - Help_MaskMode
      - Default Fallback Intent
      - Help_DeviceSettings
    positive_example: "Can I create my own custom memory?"
    hard_negative_example: "How do I change to a different memory?"

  - name: "Help_DemoMode"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain demo mode - using or demonstrating the app without hearing aids
      connected.
    trigger_conditions:
      - User asks what demo mode is or whether the app has one.
      - User asks how to enable, access or use demo mode.
      - User asks how to use or show the app without hearing aids connected.
      - User asks to test drive or demonstrate the app or the aids.
      - User asks how to see what the hearing aids can do.
    do_not_trigger:
      - Questions about app settings or modes such as Basic and Advanced, which
        are Help_AppSettings.
      - Questions about what is new in the app, which are Help_WhatsNew.
      - Questions about pairing aids that are not connecting, which are
        Help_Pairing.
    boundary_cases:
      - Demo mode is about operating WITHOUT aids. A user who wants their aids
        connected but cannot connect them is Help_Pairing.
      - Basic and Advanced are app modes, not demo mode.
    neighbor_intents:
      - Help_AppSettings
      - Help_WhatsNew
      - Help_Home
      - Default Fallback Intent
    positive_example: "Can I use the app without hearing aids connected?"
    hard_negative_example: "Why won't my hearing aids connect?"

  - name: "Help_Home"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the Home or main screen - how to reach it, what it shows, and what
      can be adjusted from it.
    trigger_conditions:
      - User asks where the Home or main screen is.
      - User asks how to get to or back to the Home screen.
      - User asks what is on the Home screen or what can be adjusted there.
      - User asks for help with the main screen.
    do_not_trigger:
      - Questions about app settings, which are Help_AppSettings.
      - Questions about what is new in the app, and requests for a quick
        start, overview or getting-started guide, which are Help_WhatsNew.
      - Questions about a specific feature, which belong to that feature's
        intent.
      - Questions about where a health, hearing or activity figure can be seen
        in the app, which are Help_Health. This intent is the Home or main
        screen itself, not any screen that happens to be in the app.
    boundary_cases:
      - Where a specific feature is named, that feature's intent always wins.
        This intent is the Home or main SCREEN itself, not a general
        orientation catch-all for the help space.
      - A broad question naming no screen and no feature is Default Fallback
        Intent. An earlier version of this spec claimed those as orientation
        questions. The claim had no support in the seed evidence - 16 of this
        intent's 23 seeds name the home or main screen outright and none is a
        general how-do-I-use-the-app question - and it collided with
        Help_WhatsNew, Help_DemoMode and Help_Health at once.
    neighbor_intents:
      - Help_AppSettings
      - Help_WhatsNew
      - Help_VoiceAssistant
      - Default Fallback Intent
      - Help_DemoMode
      - Help_Reminder
      - Help_Health
    positive_example: "What's on the Home screen?"
    hard_negative_example: "Where do I find the app settings?"

  - name: "Help_WhatsNew"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain what has changed in the current version of the app or hearing
      aids, and provide the quick start or getting-started overview.
    trigger_conditions:
      - User asks what is new in the app, the version or the hearing aids.
      - User asks what has changed or what is different about this version.
      - User asks for a quick start guide, overview or summary of the app.
      - User asks how to get started.
    do_not_trigger:
      - Questions about which app version is installed, which are
        Help_AppSettings.
      - Questions about the Home screen, which are Help_Home.
      - Questions about a specific feature's behaviour, which belong to that
        feature's intent.
    boundary_cases:
      - Identifying the version is Help_AppSettings; describing what that
        version changed is this intent.
      - Quick start and getting started resolve here, since the seed evidence
        groups onboarding material with release information.
    neighbor_intents:
      - Help_AppSettings
      - Help_Home
      - Help_DemoMode
      - Default Fallback Intent
    positive_example: "What's new in this version of the app?"
    hard_negative_example: "Which version of the app am I using?"

  # ===========================================================================
  # RECOVERED INTENTS
  # ---------------------------------------------------------------------------
  # These three ship in the product but have no seed .txt in the Dialogflow
  # export; their utterances come from the training CSVs. Cmd.MemoryChange is
  # the largest intent in the taxonomy (1,884 rows) and was missing entirely
  # from the first pass.
  # ===========================================================================

  - name: "Cmd.MemoryChange"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Switch the hearing aids to a different saved memory or program - Normal,
      Restaurant, Outdoors, Car, Music, Television and the rest - either by
      naming it directly or by describing the listening environment the user
      has just entered.
    trigger_conditions:
      - User asks to change, switch, go to or activate a named memory, program,
        profile or setting.
      - User names a listening environment from the memory vocabulary and asks
        to be put into it.
      - User states which environment they have just entered or are currently
        in, where the product has a memory for it.
      - User asks to return to normal, default or automatic.
      - User reports that the current program does not suit where they are.
    do_not_trigger:
      - Questions asking HOW to change memories, which are
        Help_ChangingMemories. This is the highest-volume
        Command-versus-Question boundary in the product.
      - Requests to CREATE, save, customize, geotag or delete a memory, which
        are Help_MemoryOptions.
      - Complaints about hearing difficulty naming neither a program nor an
        environment and asking for no action, which are Default Fallback
        Intent. With an environment named, or with a request for clarity, they
        are Cmd.EdgeModeIncrease.
      - Requests to change loudness, which belong to the AudioControl family.
      - Observations about the DEVICE's state ("it sounds quiet today"), which
        are Fallback.
      - Bare uses of a word that is both a memory name and another intent's
        subject - "mute", "tinnitus", "television". With no explicit request
        to change memory or program these are Cmd.VolumeMute, Help_Tinnitus,
        Cmd.StreamingStart and the rest.
    boundary_cases:
      - A named memory, program, profile or setting is an explicit change
        request. A hearing-difficulty complaint naming none of those and
        asking for no action is Default Fallback Intent; one that names an
        environment, or asks for clarity, is Cmd.EdgeModeIncrease.
      - A named environment or program is the deciding signal, and this is the
        one place where a pure observation IS an actionable command - "I'm
        outdoors now", "I just walked into church" - because the product's
        memories are environment-scoped. The observation must be about WHERE
        THE USER IS. An environment named as the CAUSE OF DIFFICULTY ("it's
        noisy in this restaurant, I can't follow") is Cmd.EdgeModeIncrease.
        Default Fallback Intent carries the matching carve-out.
      - The exception is narrow. It applies only when the observation names a
        listening ENVIRONMENT. An observation about the hearing aids
        themselves stays Fallback.
      - Some seed utterances name a sound feature rather than a memory
        ("activate speech focus", "apply wind noise reduction"). Treat those
        as this intent only when phrased as selecting a setting; a description
        of struggling to hear is Cmd.EdgeModeIncrease.
      - >-
        The memory name is a slot, not a separate intent - but a bare memory
        name is not enough. This intent requires an EXPLICIT request to change
        memory or program: "switch to X", "change my memory to X", "put me in
        X", "activate the X memory". Several memory names are also other
        intents' subjects (Mute, Tinnitus, Television, Speech, Noise, Mask,
        Telephone); with no explicit change request those utterances belong to
        the intent that owns the subject.
      - Naming a MODE is not a request to change program. "Mask Mode" is the
        subject of Help_MaskMode and resolves there whatever verb surrounds
        it, in the same way that naming any other mode is not by itself a
        memory switch. This intent needs the bare memory name with an explicit
        change verb.
    neighbor_intents:
      - Help_ChangingMemories
      - Help_MemoryOptions
      - Cmd.EdgeModeIncrease
      - Help_Customize
      - Default Fallback Intent
      - Cmd.VolumeMute
      - Cmd.StreamingStart
      - Help_Tinnitus
      - Help_MaskMode
      - Help_Pairing
    positive_example: "I've just sat down in a busy restaurant."
    hard_negative_example: "How do I change to a different memory?"

  - name: "Cmd.SendMessage"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Record and send a voice or push-to-talk message, optionally to a named
      recipient.
    trigger_conditions:
      - User asks to send a message, voice message, audio note, recording or
        voice clip.
      - User asks to start or use push-to-talk.
      - User asks to tell, message, ping or reach a named person or relation.
      - User asks to pass along, forward or relay something to someone.
      - User asks to let someone know something.
    do_not_trigger:
      - Requests to PLAY or hear a message, which are Cmd.ListenMessage.
      - Requests to transcribe or record a conversation as text, which are
        Cmd.TranscribeStart - that produces a transcript, not a sent message.
      - Requests to set a reminder about contacting someone, which are
        reminders.add.
      - Questions about what the voice assistant can do, which are
        Help_VoiceAssistant.
      - Bare confirmations such as yes or cancel. Those are handled by the
        confirmation gate, not by any intent.
      - How-to questions about sending messages or using push-to-talk ("how do
        I send a voice message?"). The taxonomy has no messaging Help intent,
        so these are Default Fallback Intent. Help_VoiceAssistant explains the
        assistant itself, not this feature.
    boundary_cases:
      - Direction decides this intent against Cmd.ListenMessage - outbound is
        this, inbound is that.
      - A recipient is a slot, not a separate intent; the request resolves here
        with or without one.
      - Recording to send differs from recording to transcribe. If the utterance
        implies another person receives it, it is this intent.
      - A user answering yes or no to a send confirmation is not classified
        here; the engine's confirmation gate owns that turn.
    neighbor_intents:
      - Cmd.ListenMessage
      - Cmd.TranscribeStart
      - reminders.add
      - Help_VoiceAssistant
      - Default Fallback Intent
    positive_example: "Let my daughter know I'm on my way."
    hard_negative_example: "Play my last message."

  - name: "Cmd.ListenMessage"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Play back or read out messages the user has received - voice or
      push-to-talk messages, and incoming texts read aloud.
    trigger_conditions:
      - User asks to play, replay, hear or listen to a message.
      - User asks to have incoming texts or messages read aloud.
      - User asks what messages or texts they have received.
      - User asks who has messaged them, expecting the content played back.
      - User asks to hear the last or latest message again.
    do_not_trigger:
      - Requests to SEND or record a message, which are Cmd.SendMessage.
      - Requests to start live transcription of a conversation, which are
        Cmd.TranscribeStart.
      - Requests to start streaming audio from a TV or microphone, which are
        Cmd.StreamingStart.
      - How-to questions about messaging or push-to-talk ("how do I play my
        messages?"). The taxonomy has no messaging Help intent, so these are
        Default Fallback Intent until one exists - Help_VoiceAssistant
        explains the assistant itself, not this feature.
    boundary_cases:
      - Direction decides this intent against Cmd.SendMessage - inbound is
        this, outbound is that.
      - This intent covers both voice messages and texts read aloud; the
        medium is not a distinguishing factor.
      - Playing a received message differs from streaming live audio. A named
        message or sender resolves here; a named external source is
        Cmd.StreamingStart.
      - A bare "play it" with no other context resolves here, since the seed
        evidence establishes terse replay requests as normal usage.
      - The product plays the most recent message; it does not list or
        summarise a mailbox. Inventory-style queries ("what messages do I
        have?", "who messaged me?") still resolve here and are answered by
        playing the latest message.
    neighbor_intents:
      - Cmd.SendMessage
      - Cmd.TranscribeStart
      - Cmd.StreamingStart
      - Help_VoiceAssistant
      - Default Fallback Intent
    positive_example: "Read me the latest message."
    hard_negative_example: "Send a message to my son."
