      - User asks whether their hearing aids support IntelliVoice.
    do_not_trigger:
      - Questions about Edge Mode, which are Help_EdgeMode.
      - Questions about the voice assistant that responds to spoken commands,
        which are Help_VoiceAssistant.
      - Direct requests to improve speech clarity now, which are
        Cmd.EdgeModeIncrease.
    boundary_cases:
      - IntelliVoice and the Thrive voice assistant are different features
        despite both containing the word voice. Questions about talking TO the
        assistant are Help_VoiceAssistant.
      - The seed data contains the variant spelling Intelligent Voice; it refers
        to the same feature.
      - There is no Cmd intent for IntelliVoice, so a direct request to run or
        switch it on stays here rather than resolving to a command. The
        deployed rows are entirely question-shaped, so this covers generated
        edge cases rather than observed speech - but the nearest command
        attractor is Cmd.EdgeModeIncrease, which would apply Edge Mode
        instead, and that is a device action the user never asked for.
        Help_MaskMode states the same rule for the same reason.
    neighbor_intents:
      - Help_EdgeMode
      - Help_VoiceAssistant
      - Default Fallback Intent
    positive_example: "When should I use IntelliVoice?"
    hard_negative_example: "How does the voice assistant work?"

  - name: "Help_MaskMode"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain Mask Mode - the Mask listening program in the app's memory list
      - what it is, where to find it, and how to switch it on or off.
    trigger_conditions:
      - User asks what Mask Mode is or what it does.
      - User asks how to enable, disable or find Mask Mode.
      - User asks whether Mask Mode will help them.
    do_not_trigger:
      - Questions about Edge Mode or general noise reduction, which are
        Help_EdgeMode.
      - Questions about adding mask as a saved memory, which are
        Help_MemoryOptions.
      - Direct requests to improve clarity now, which are
        Cmd.EdgeModeIncrease.
      - Requests to switch to the "Mask" MEMORY by its bare name, which are
        Cmd.MemoryChange - "switch to Mask", "change my memory to Mask".
        "Mask" is both a memory name and this intent's subject, and the change
        verb with the bare name is what separates them. The phrase "Mask Mode"
        stays here even with an on or off verb.
      - Questions about the tinnitus masker, which are Help_Tinnitus. The two
        are separate features that merely share a word stem - masking sound
        for tinnitus is not the Mask listening program.
    boundary_cases:
      - The phrase "Mask Mode" names this feature, so it resolves here
        whatever verb surrounds it - asking what it is, asking how to find it,
        and asking to turn it on or off are all this intent. Naming a mode is
        not a request to change program. A memory switch needs the bare memory
        name with an explicit change verb, as in "switch to Mask", and that is
        Cmd.MemoryChange.
      - Creating a custom memory named mask is memory management and belongs to
        Help_MemoryOptions.
      - Mask Mode is a listening program in the app's memory list, alongside
        Restaurant, Car and Noise. It is NOT a face-mask remedy - an earlier
        version of this spec described it that way and that description was
        wrong. A complaint about struggling to hear someone names no feature
        and is not this intent.
    neighbor_intents:
      - Help_EdgeMode
      - Help_MemoryOptions
      - Default Fallback Intent
      - Cmd.MemoryChange
      - Help_Tinnitus
    positive_example: "How do I turn Mask Mode on?"
    hard_negative_example: "Add mask as a customized memory."

  - name: "Help_Tinnitus"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the tinnitus masker feature - the therapeutic noise or white noise
      the aids can play - and how to find and adjust its settings.
    trigger_conditions:
      - User asks how to adjust the tinnitus masker, tinnitus noise or white
        noise.
      - User asks where tinnitus settings are in the app.
      - User asks how to change tinnitus levels or programs.
      - User asks whether the tinnitus feature can be turned off or changed.
    do_not_trigger:
      - Requests to change HEARING AID volume, which are the Cmd.Volume*
        intents. The tinnitus masker has its own separate level.
      - Questions about general hearing-aid volume control, which are
        Help_Volume.
      - Requests to change to a different listening memory, which are
        Help_ChangingMemories.
      - Requests to switch to the "Tinnitus" MEMORY, which are
        Cmd.MemoryChange. "Tinnitus" is both a memory name and this intent's
        subject; an explicit request to change memory or program is that
        intent, anything else is this one.
      - Questions about the medical condition itself - what tinnitus is, why
        the ears ring, whether it can be cured. This intent explains the
        masker FEATURE. The product does not answer clinical questions, so
        those are Default Fallback Intent.
      - Questions about Mask Mode, the Mask listening program in the app's
        memory list, which are Help_MaskMode. The shared mask stem is a
        coincidence - this intent's subject is the tinnitus masker.
    boundary_cases:
      - The object decides the intent. Loudness words attached to tinnitus,
        masker or white noise resolve here; the same words attached to the aids
        or to sound generally resolve to the volume intents.
      - This is a clinically sensitive feature; where a request is ambiguous
        between adjusting the masker and adjusting amplification, prefer this
        intent's explanation over a volume command.
    neighbor_intents:
      - Help_ChangingMemories
      - Default Fallback Intent
      - Help_Volume
      - Cmd.MemoryChange
      - Help_MaskMode
    positive_example: "How do I turn up the tinnitus noise?"
    hard_negative_example: "Turn up the volume in my hearing aids."

  # ===========================================================================
  # FAMILY: HelpHealth
  # ---------------------------------------------------------------------------
  # Help_Activity and Help_Health overlap heavily in the seed data. The line
  # drawn here: Help_Activity CONFIGURES an activity goal; Help_Health explains
  # the Health screen and where health data is found.
  # ===========================================================================

  - name: "Help_Activity"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain how to set up, change or edit activity goals - steps, walking,
      running, biking, standing, aerobics, exercise and calories - and where
      activity distance is shown.
    trigger_conditions:
      - User asks how to set, set up, change or edit an activity goal.
      - User asks how to calculate or where to see distance for a tracked
        activity.
      - User uses a bare configuration phrase such as edit step goal or set up
        walking goal.
    do_not_trigger:
      - Any query for the user's actual progress or goal VALUE, which belongs
        to one of the matching Cmd.Activity* intents - Cmd.ActivityStep,
        Cmd.ActivityWalk, Cmd.ActivityRun, Cmd.ActivityCycle,
        Cmd.ActivityStand, Cmd.ActivityAerobics, Cmd.ActivityExercise or
        Cmd.ActivityCalories. Configuring differs from querying.
      - Questions about the Health screen as a whole, or about viewing health
        goals, which are Help_Health.
      - Questions about heart rate, which are Help_HeartRate.
    boundary_cases:
      - Setting versus reading is the whole distinction. Set, set up, change,
        edit and create resolve here; how far, how long, how many and have I
        reached resolve to the Cmd.Activity* intents.
      - The split covers ALL EIGHT tracked activities - walking, steps,
        running, cycling/biking, standing, aerobics, exercise and calories. A
        set/change/edit request for any of their goals resolves here; the
        matching Cmd.Activity* intent owns the data query.
      - The legacy seed file for this intent contains a small number of
        progress-query utterances that are mislabelled. The rule above
        overrides the seed data.
      - Where the question is about finding a screen rather than changing a
        goal, prefer Help_Health.
    neighbor_intents:
      - Help_Health
      - Cmd.ActivityStep
      - Cmd.ActivityWalk
      - Cmd.ActivityExercise
      - Default Fallback Intent
      - Help_ThriveScore
      - Cmd.ActivityRun
      - Cmd.ActivityCycle
      - Cmd.ActivityStand
      - Cmd.ActivityAerobics
      - Cmd.ActivityCalories
    positive_example: "How do I change my walking goal?"
    hard_negative_example: "How far have I walked today?"

  - name: "Help_Health"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the Health screen - what it shows, how to view health and hearing
      goals, and how to change the period those goals are measured over.
    trigger_conditions:
      - User asks what the Health screen shows or what health features exist.
      - User asks how to see their health, hearing, activity or interaction
        goals.
      - User asks how to change a goal's period, such as from daily to weekly.
      - User asks where in the app a particular health figure can be seen.
    do_not_trigger:
      - Any query for the actual value of tracked activity data, which belongs
        to the matching Cmd.Activity* intent.
      - Questions specifically about setting up an activity goal's target, which
        are Help_Activity.
      - Questions about heart rate, which are Help_HeartRate, or about heart
        rate recovery, which are Help_HeartRateRecovery.
      - Questions about the Thrive score, which are Help_ThriveScore.
      - Questions about the Home or main screen, or broad questions about the
        app naming no health figure, which are Help_Home.
    boundary_cases:
      - This intent is about LOCATING and VIEWING; Help_Activity is about
        CONFIGURING a target; the Cmd.Activity* intents return the data itself.
      - Changing the measurement period is a Health screen concern and resolves
        here, not to Help_Activity.
      - Where a question names heart rate, prefer Help_HeartRate, or
        Help_HeartRateRecovery when it names recovery.
    neighbor_intents:
      - Help_Activity
      - Help_HeartRate
      - Help_ThriveScore
      - Cmd.ActivityStep
      - Help_HeartRateRecovery
      - Help_FallAlert
      - Default Fallback Intent
      - Help_Home
    positive_example: "What does the Health screen show?"
    hard_negative_example: "How do I set my step goal?"

  - name: "Help_HeartRate"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the heart rate feature - what it is, how it works, how to take a
      reading, and where to find it in the app. The assistant explains where
      the reading is shown; it does not report the value.
    trigger_conditions:
      - User asks what heart rate is, or how the heart rate function works.
      - User asks how to check, measure or monitor their heart rate.
      - User asks where the heart rate feature is in the app.
      - User asks whether the product can measure heart rate.
    do_not_trigger:
      - Questions about heart rate RECOVERY, which are Help_HeartRateRecovery -
        a distinct measurement.
      - Questions about the Health screen generally, which are Help_Health.
      - Questions about activity or exercise data, which are the Cmd.Activity*
        intents.
    boundary_cases:
      - The word recovery moves an utterance to Help_HeartRateRecovery. Without
        it, heart rate questions resolve here.
      - The assistant does not report a heart rate. It explains where the
        reading is found, so a direct request for the current value belongs
        here as much as a how-to question - precedence rule 4's clause "when
        the requested action IS explaining, it is the Help intent" covers
        both. Help_FindMyHearingAids is the same shape. An earlier version
        claimed the value itself as a trigger, which asserted a capability the
        product does not have.
    neighbor_intents:
      - Help_HeartRateRecovery
      - Help_Health
      - Help_ThriveScore
      - Default Fallback Intent
    positive_example: "Where do I find my heart rate?"
    hard_negative_example: "What is a normal heart rate recovery number?"

  - name: "Help_HeartRateRecovery"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain heart rate recovery - what the measurement means, how it is
      calculated, and how to access it in the app.
    trigger_conditions:
      - User asks what heart rate recovery is or means.
      - User asks how heart rate recovery is measured or calculated.
      - User asks how to find or access the heart rate recovery feature.
    do_not_trigger:
      - Questions about plain heart rate measurement, which are Help_HeartRate.
      - Questions about the Health screen generally, which are Help_Health.
      - Questions about the Thrive score, which are Help_ThriveScore.
      - Questions asking whether the user's own value is good or normal, or
        how to improve it, which are Default Fallback Intent. This intent
        explains the measurement, not the user's health.
    boundary_cases:
      - The word recovery is the deciding signal, and it is the only thing
        separating this intent from Help_HeartRate.
      - Explaining the measurement is this intent; interpreting the user's own
        result is not. Whether a value is good, what counts as normal, and how
        to improve it are health questions rather than product questions, and
        are Default Fallback Intent under the same rule that sends clinical
        tinnitus questions there.
    neighbor_intents:
      - Help_HeartRate
      - Help_Health
      - Help_ThriveScore
      - Default Fallback Intent
    positive_example: "How is heart rate recovery calculated?"
    hard_negative_example: "How do I measure my heart rate?"

  - name: "Help_FallAlert"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the fall detection and alert feature - how it works, how to set it
      up, how alert contacts are managed, and what the user will see or hear
      when an alert is sent or cancelled.
    trigger_conditions:
      - User asks how fall detection or Fall Alert works.
      - User asks how to set up fall detection or turn on automatic alerts.
      - User asks how to add, change or manage alert contacts.
      - User asks how to send or cancel a manual alert.
      - User asks what they will hear or see when a fall is detected.
      - User reports that Fall Alert is not working.
    do_not_trigger:
      - Questions about the Health screen or activity goals, which are
        Help_Health.
      - Questions about locating misplaced hearing aids, which are
        Help_FindMyHearingAids.
      - General device troubleshooting, which is Help_SelfCheck.
    boundary_cases:
      - This is a safety feature; where an utterance is ambiguous between this
        intent and a general help intent, prefer this one, since an unanswered
        safety question is costlier than a redundant explanation.
      - An actual emergency in progress is out of scope for this assistant and
        maps to Fallback.
    neighbor_intents:
      - Help_Health
      - Help_SelfCheck
      - Default Fallback Intent
    positive_example: "How do I set up fall detection?"
    hard_negative_example: "Where are my hearing aids?"

  - name: "Help_ThriveScore"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the Thrive wellness score and its component scores - Body, Brain,
      Kind and iPro - including how they are calculated and how to improve them.
    trigger_conditions:
      - User asks what the Thrive score or any component score means.
      - User asks how a score is calculated.
      - User asks how to improve or increase a score.
      - User asks for help or information about a named score.
      - User asks why they cannot reach a particular score value.
    do_not_trigger:
      - Questions about the Health screen or health goals generally, which are
        Help_Health.
      - Questions about specific activity data, which are the Cmd.Activity*
        intents.
      - Questions about heart rate measurements, which are Help_HeartRate and
        Help_HeartRateRecovery.
    boundary_cases:
      - A named score - Thrive, Body, Brain, Kind or iPro - is the deciding
        signal for this intent.
      - Improving a score is an information request, not an action; there is no
        command that changes a score.
    neighbor_intents:
      - Help_Health
      - Help_HeartRate
      - Help_Activity
      - Default Fallback Intent
      - Help_HeartRateRecovery
    positive_example: "How is the Thrive score calculated?"
    hard_negative_example: "How do I see my health goals?"

  # ===========================================================================
  # FAMILY: HelpFind
  # ===========================================================================

  - name: "Help_FindMyHearingAids"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Help the user locate misplaced HEARING AIDS, including one specific
      side. The assistant cannot locate an aid itself - it explains how to
      find one - so requests phrased as commands belong here too.
    trigger_conditions:
      - User asks where their hearing aids or one named aid is.
      - User reports that an aid is lost, missing or misplaced.
      - User asks the assistant to find, locate or search for their aids.
      - User asks how to search for their aids.
    do_not_trigger:
      - Requests to find the PHONE, which are Cmd.FindMyPhone. This is the only
        distinction that matters here.
      - Reports that an aid is not working rather than not found, which are
        Help_SelfCheck.
      - Questions about pairing or connection, which are Help_Pairing.
    boundary_cases:
      - The object decides the intent. Aid, aids or hearing aids resolve here;
        phone, telephone or a phone brand resolves to Cmd.FindMyPhone.
      - Lost differs from broken. An aid that cannot be found is this intent;
        an aid that is found but faulty is Help_SelfCheck.
      - An aid that will not connect is Help_Pairing, not a location problem.
      - Direct requests belong here as much as how-to questions. The assistant
        cannot locate an aid; it can only explain how to. Precedence rule 4's
        clause "when the requested action IS explaining, it is the Help
        intent" therefore covers both phrasings - "find my hearing aids" and
        "how do I find my hearing aids" are the same intent. Deployed speech
        for this intent is 40.6% command-shaped, and generation must match
        that rather than producing how-to phrasing only; a generated rate near
        zero is a defect, not a success.
    neighbor_intents:
      - Cmd.FindMyPhone
      - Help_SelfCheck
      - Default Fallback Intent
    positive_example: "I've misplaced my left hearing aid."
    hard_negative_example: "I can't find my phone."

