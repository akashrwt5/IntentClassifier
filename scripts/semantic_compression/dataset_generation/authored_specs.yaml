  - name: "Help_VoiceAssistant"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the Thrive voice assistant itself - what it is, what it can be
      asked to do, how to reach it, and whether it works without a phone.
    trigger_conditions:
      - User asks what the voice or virtual assistant is, or how it works.
      - User asks what they can ask the assistant to do.
      - User asks how to control their hearing aids by speaking.
      - User asks where to find the assistant, or for its user guide.
      - User asks whether the assistant works without the phone.
    do_not_trigger:
      - Questions about IntelliVoice, a sound-processing feature, which are
        Help_IntelliVoice.
      - Questions about transcription or translation, which have their own
        intents.
      - Any actual request to send or play a message, which are
        Cmd.SendMessage and Cmd.ListenMessage.
      - Any actual command directed at the assistant, which belongs to
        whichever intent that command names.
      - How-to questions about messaging or push-to-talk. This intent explains
        the assistant itself, not an individual feature; with no messaging
        Help intent in the taxonomy these are Default Fallback Intent.
    boundary_cases:
      - This intent is the assistant talking about itself. Any request that asks
        it to DO something resolves to that action's intent instead.
      - IntelliVoice is a different feature despite the shared word voice.
      - Questions naming third-party assistants are out of scope and map to
        Fallback.
    neighbor_intents:
      - Help_IntelliVoice
      - Cmd.SendMessage
      - Cmd.ListenMessage
      - Help_Transcribe
      - Default Fallback Intent
      - Help_Home
    positive_example: "What can I ask Thrive Assistant to do?"
    hard_negative_example: "What is IntelliVoice?"

