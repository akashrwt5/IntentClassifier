        Help_Battery.
      - Questions about battery life expectancy, battery types or troubleshooting
        charging problems, which are Help_Battery.
      - Requests about the battery of a phone or accessory rather than the
        hearing aids.
    boundary_cases:
      - This intent reports a live value; Help_Battery explains a procedure. A
        how or why question about batteries is always Help_Battery.
      - A bare mention of the word battery with no verb resolves here, since
        the seed evidence establishes terse status queries as normal usage.
      - A report that the battery is dead or flat is not a level query. Asked
        what to do about it, that is Help_Battery; stated with no request at
