  # ===========================================================================
  # FAMILY: Reminders
  # ---------------------------------------------------------------------------
  # Contains the family's own Command-vs-Question pair: reminders.add is the
  # action, Help_Reminder is the how-to. Written together so the line holds.
  # ===========================================================================

  - name: "reminders.add"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Create a new reminder, optionally with a subject, a time, a date or a
      recurrence.
    trigger_conditions:
      - User asks to add, set, create or schedule a reminder.
      - User asks to be reminded about something, at a time, on a date, or
        repeatedly.
      - User asks not to be allowed to forget something.
      - User asks to remember something for them.
    do_not_trigger:
      - Questions asking HOW to set reminders, whether reminders exist, or where
        to find them. Those are Help_Reminder.
      - Requests to mark an existing reminder finished, which are
        reminders.complete.
      - Requests to transcribe or record a conversation, which are
        Cmd.TranscribeStart.
      - Statements merely mentioning a future event with no request to be
        reminded.
    boundary_cases:
      - Time, date and recurrence are slots, not separate intents. A reminder
        with no time still resolves here.
      - A reminder about a medical or personal matter is still just a reminder;
        the subject never changes the intent.
      - Asking whether the product can set reminders is a capability question
        and belongs to Help_Reminder.
    neighbor_intents:
      - reminders.complete
      - Help_Reminder
      - Cmd.TranscribeStart
      - Default Fallback Intent
      - Cmd.SendMessage
    positive_example: "Don't let me forget to pick up milk today."
    hard_negative_example: "Can I set reminders in my hearing aids?"

  - name: "reminders.complete"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Mark an existing reminder as done.
    trigger_conditions:
      - User states that a reminder is complete, done or finished.
      - User asks to complete, finish or mark off a reminder.
      - User refers to their latest or last reminder as finished.
    do_not_trigger:
      - Requests to create a new reminder, which are reminders.add.
      - Requests to delete, cancel or postpone a reminder, which are not
        supported actions and map to Fallback.
      - Questions about how reminders work, which are Help_Reminder.
    boundary_cases:
      - Completing and deleting are different outcomes. Only completion is
        supported; cancellation or removal goes to Fallback.
      - Under the negation rule, cancelling a reminder without replacement is
        Fallback, not this intent.
    neighbor_intents:
      - reminders.add
      - Help_Reminder
      - Default Fallback Intent
    positive_example: "Mark my last reminder as done."
    hard_negative_example: "Delete that reminder."

  - name: "Help_Reminder"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Explain the reminders feature - what it is, whether it is available, and
      how to create or manage reminders.
    trigger_conditions:
      - User asks how to set, create or manage reminders.
      - User asks what reminders are or what the feature does.
      - User asks whether the hearing aids or the app can set reminders.
      - User asks for reminder help, a user guide, or where reminders live.
    do_not_trigger:
      - Any actual request to create a reminder, which is reminders.add.
      - Any request to complete a reminder, which is reminders.complete.
      - Questions about calendar apps outside this product.
    boundary_cases:
      - This is the Question side of the reminders pair. If the utterance would
        cause a reminder to exist, it is reminders.add; if it would only produce
        an explanation, it is this intent.
      - Capability questions ("can Thrive set reminders") are information
        requests and resolve here.
    neighbor_intents:
      - reminders.add
      - reminders.complete
      - Help_Home
      - Default Fallback Intent
    positive_example: "How do I set up a daily reminder?"
    hard_negative_example: "Set a daily reminder for my tablets."

  # ===========================================================================
  # FAMILY: ActivityTracking
  # ---------------------------------------------------------------------------
  # Eight sibling intents that all QUERY tracked fitness data. They differ only
  # by which activity is named. Two rules are stated identically in all eight,
  # because they are the only things that separate them:
  #   1. The named activity decides the intent.
  #   2. Querying progress is a Command here; SETTING or CHANGING a goal is
  #      Help_Activity, and asking WHERE to see it is Help_Health.
  # Cmd.Health, the former rollup parent of this family, was dropped from the
  # taxonomy - 155 of its 160 utterances were duplicates of these children.
  # ===========================================================================

  - name: "Cmd.ActivityWalk"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Report the user's walking data - distance, duration, progress toward the
      walking goal, or calories burned walking.
    trigger_conditions:
      - User asks how far or how long they have walked, over any period.
      - User asks about progress toward, or the value of, their walking goal.
      - User asks how much further they need to walk.
      - User asks about calories burned while walking.
      - User asks to see their walking history.
    do_not_trigger:
      - Requests to SET, change or edit a walking goal, which are
        Help_Activity.
      - Questions about where in the app walking data is displayed, which are
        Help_Health.
      - Queries naming a different activity - steps (Cmd.ActivityStep),
        running or jogging (Cmd.ActivityRun), cycling or biking
        (Cmd.ActivityCycle), standing (Cmd.ActivityStand), aerobics
        (Cmd.ActivityAerobics), or exercise/workout (Cmd.ActivityExercise) -
        which belong to that activity's intent.
      - Calorie queries with no activity named, which are
        Cmd.ActivityCalories.
    boundary_cases:
      - The named activity decides the intent; walking, walked and walk
        resolve here.
      - Querying is a Command, configuring is Help_Activity, and locating the
        screen is Help_Health. This split is identical across all eight
        activity intents.
      - Standing and stepping are tracked separately and are not walking.
      - A distance query that NAMES walking resolves here. A bare distance
        query with no activity named ("how far have I gone?") is
        Cmd.ActivityStep, where distance is derived from step count.
        Cmd.ActivityStep states this identically.
    neighbor_intents:
      - Cmd.ActivityStep
      - Cmd.ActivityRun
      - Cmd.ActivityStand
      - Help_Activity
      - Cmd.ActivityCalories
      - Cmd.ActivityCycle
      - Default Fallback Intent
    positive_example: "How much have I walked this week?"
    hard_negative_example: "How do I change my walking goal?"

  - name: "Cmd.ActivityStep"
    authored_by: "assistant-session (claude-opus-5), pending human review"
    business_description: >-
      Report the user's step count data - steps taken, progress toward the step
