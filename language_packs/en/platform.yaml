- intent: Help_DeviceSettings
  regex: \b(everything|audio|sounds?)\b.{0,15}\b(muffled|distorted|garbled|warped)\b
- intent: Cmd.BatteryLevel
  regex: \b(power|battery)\s+(reading|level|status|left|remaining)\b|\b(die|dying|run
