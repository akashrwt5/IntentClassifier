- intent: Cmd.MemoryChange
  regex: \b(load|restore|apply|use)\b.{0,20}\b(my )?(usual|default|normal|saved|last|previous)\b.{0,15}\b(config|configuration|setting|program|profile|memory)\b
- intent: Cmd.MemoryChange
  regex: \b(swap|switch|change|flip)\b.{0,15}\b(to the |to my )?(program|memory|setting|mode|profile)\b.{0,20}\bfor\b
- intent: Help_Home
  regex: \bwhat features\b|\bfeatures (are )?available\b|\bpoint me in the right direction\b|\bhow
    does (this|it|everything) work\b
lexicon:
  carriers:
  - ^\s*(?:can|could|would|will)\s+you\s+(?:please\s+)?
  - ^\s*i\s+want\s+you\s+to\b\s*
  - ^\s*please\s+
  - ^\s*\w+\s+me\s+(?:to|about|that|when)\b\s*
  - ^\s*i\s+(?:must|mustn'?t|must\s+not|can'?t|cannot|should|shouldn'?t)\s+forget\s*(?:(?:to|about)\b)?\s*
  - ^\s*(?:make|add|create|leave)\s+(?:an?\s+)?(?:note|reminder|alarm)\s*(?:(?:to|about|that|for)\b)?\s*
  - ^\s*(?:do\s*n[o']?t|don't|dont)\s+let\s+me\s+forget\b\s*(?:(?:to|about)\b)?\s*
  - ^\s*(?:remind|tell|alert|notify)\s+me\b\s*(?:(?:to|that|about|of)\b)?\s*
  - ^\s*set(?:\s+up)?\s+(?:an?\s+)?(?:reminder|alarm)\b\s*(?:(?:to|about)\b)?\s*
  - ^\s*make\s+sure\s+(?:i|to)\b\s*
  - ^\s*i\s+(?:need|have|want)\s+to\b\s*
  leading_connectors:
  - for
  - about
  - of
  - 'on'
  - to
  - that
  - regarding
  - with
  negation_cues:
  - not
  - don't
  - dont
  - do not
  - never
  - without
  - no need to
  - stop
  - cancel
  fuzzyStopwords:
