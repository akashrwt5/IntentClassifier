help_marker_guard:
  markers: (how\s+(to|do\s+i|does|can\s+i|is|would\s+i)\b)|(\bguide\b)|(\bexplain\b)|(\btutorial\b)|(what\s+(is|are|does)\b)|(where\s+(can|do)\s+i\s+(see|find|view))|(is\s+there\s+a\s+way)|(help\s+(with|me\s+understand|for|understanding))|(how\s+to\s+use)|(\w+\s+help\b)|(does\s+\w+\s+(keep|save|store|record|work))|(can\s+the\s+app)
  pairs:
    Cmd.MemoryChange: Help_MemoryOptions
    Cmd.VolumeDecrease: Help_Volume
    Cmd.VolumeIncrease: Help_Volume
    Cmd.VolumeMute: Help_Volume
    Cmd.VolumeUnmute: Help_Volume
    reminders.complete: Help_Reminder
    reminders.add: Help_Reminder
    Cmd.StreamingStart: Help_Accessories
    Cmd.StreamingStop: Help_Accessories
    Cmd.TranscribeStart: Help_Transcribe
    Cmd.TranslationStart: Help_Translate
interrupt_threshold: 0.68
keyword_triggers:
- intent: Cmd.TranslationStart
  not_regex: \b(feature|function|explain|guide me|how (do|does|to)|what (is|are|languages|can)|where
    (is|do|are)|is there|does (it|the)|can (it|i)|help (with|me understand|understanding)|saved?|tutorial|available|supported|support|offered?|which|options?)\b
  regex: \btranslat(e|es|ing|ion)\b
- intent: Cmd.TranscribeStart
  not_regex: \b(feature|function|explain|guide me|how (do|does|to)|what (is|are|languages|can)|where
    (is|do|are)|is there|does (it|the)|can (it|i)|help (with|me understand|understanding)|saved?|tutorial|available|supported|support|offered?|which|options?)\b
  regex: \btranscri(be|bing|ption)\b
- exact:
